<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大二英文 期中刷題</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117;--card:#181c27;--border:#252a3a;--accent:#4ade80;
  --red:#f87171;--gold:#fbbf24;--blue:#60a5fa;--purple:#c084fc;
  --text:#e2e8f0;--muted:#64748b;--soft:#1e2433;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* HOME */
#home{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;}
.brand{font-family:'Syne',sans-serif;font-size:2.2rem;font-weight:800;letter-spacing:-.02em;margin-bottom:.3rem;}
.brand span{color:var(--accent);}
.tagline{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--muted);letter-spacing:.15em;margin-bottom:2.5rem;}
.stat-row{display:flex;gap:1rem;margin-bottom:2rem;flex-wrap:wrap;justify-content:center;}
.stat{background:var(--soft);border:1px solid var(--border);padding:.5rem 1rem;font-family:'DM Mono',monospace;font-size:.75rem;color:var(--muted);}
.stat strong{color:var(--text);display:block;font-size:1.2rem;}
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;width:100%;max-width:480px;margin-bottom:1.5rem;}
@media(max-width:480px){.type-grid{grid-template-columns:1fr 1fr;}}
.type-btn{background:var(--soft);border:2px solid var(--border);padding:.8rem .5rem;cursor:pointer;font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted);text-align:center;transition:all .15s;user-select:none;}
.type-btn:hover{border-color:var(--accent);color:var(--accent);}
.type-btn.active{border-color:var(--accent);background:#052e16;color:var(--accent);}
.type-btn .tb-icon{font-size:1.3rem;display:block;margin-bottom:.25rem;}
.type-btn .tb-count{display:block;font-size:.6rem;color:var(--muted);margin-top:.2rem;}
.start-btn{background:var(--accent);color:#052e16;border:none;padding:.8rem 3rem;font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;cursor:pointer;letter-spacing:.05em;width:100%;max-width:480px;transition:opacity .15s;}
.start-btn:hover{opacity:.85;}
.start-btn:disabled{opacity:.4;cursor:not-allowed;}

/* QUIZ */
#quiz{display:none;min-height:100vh;padding:1rem;}
.quiz-inner{max-width:640px;margin:0 auto;}

/* topbar */
.topbar{display:flex;align-items:center;gap:.8rem;margin-bottom:1.2rem;}
.back-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:.35rem .7rem;font-size:.75rem;cursor:pointer;font-family:'DM Mono',monospace;}
.back-btn:hover{color:var(--text);border-color:var(--text);}
.progress-wrap{flex:1;height:4px;background:var(--soft);}
.progress-bar{height:100%;background:var(--accent);transition:width .3s;}
.prog-label{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted);white-space:nowrap;}
.score-label{font-family:'DM Mono',monospace;font-size:.7rem;white-space:nowrap;}
.score-label .sc{color:var(--accent);}
.score-label .sw{color:var(--red);}

/* question card */
.q-card{background:var(--card);border:1px solid var(--border);padding:1.4rem;margin-bottom:.8rem;}
.q-meta{display:flex;align-items:center;gap:.5rem;margin-bottom:.8rem;}
.q-type{font-family:'DM Mono',monospace;font-size:.62rem;padding:.2rem .5rem;letter-spacing:.1em;text-transform:uppercase;}
.q-type.vocab{background:#052e16;color:var(--accent);}
.q-type.grammar{background:#1e1b4b;color:var(--purple);}
.q-type.matching{background:#172554;color:var(--blue);}
.q-type.situation{background:#451a03;color:var(--gold);}
.q-type.listening{background:#1c1917;color:#a8a29e;}
.q-id{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted);}

/* listening script */
.script-box{background:var(--soft);border-left:3px solid var(--muted);padding:.8rem 1rem;margin-bottom:.9rem;font-size:.82rem;line-height:1.9;color:#94a3b8;white-space:pre-wrap;}
.script-box strong{color:var(--text);}
.tts-btn{display:flex;align-items:center;gap:.4rem;background:none;border:1px solid var(--muted);color:var(--muted);padding:.3rem .7rem;font-size:.7rem;cursor:pointer;font-family:'DM Mono',monospace;margin-bottom:.8rem;}
.tts-btn:hover{border-color:var(--blue);color:var(--blue);}
.tts-btn.playing{border-color:var(--accent);color:var(--accent);}

.q-text{font-size:1rem;line-height:1.7;margin-bottom:1rem;white-space:pre-wrap;}

/* options */
.opts{display:flex;flex-direction:column;gap:.5rem;}
.opt{background:var(--soft);border:1px solid var(--border);padding:.75rem 1rem;cursor:pointer;font-size:.9rem;line-height:1.5;transition:border-color .1s;text-align:left;color:var(--text);display:flex;align-items:flex-start;gap:.7rem;}
.opt:hover:not(:disabled){border-color:var(--text);}
.opt:disabled{cursor:default;}
.opt-key{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted);flex-shrink:0;margin-top:.15rem;min-width:1.2rem;}
.opt.correct{border-color:var(--accent);background:#052e16;}
.opt.correct .opt-key{color:var(--accent);}
.opt.wrong{border-color:var(--red);background:#2d0707;}
.opt.wrong .opt-key{color:var(--red);}

/* explanation */
.expl-box{border:1px solid var(--border);padding:1rem;font-size:.85rem;line-height:1.8;color:#94a3b8;margin-top:.6rem;}
.expl-box .expl-head{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.1em;margin-bottom:.5rem;}
.expl-box .expl-head.correct{color:var(--accent);}
.expl-box .expl-head.wrong{color:var(--red);}

/* next btn */
.next-btn{width:100%;background:var(--accent);color:#052e16;border:none;padding:.75rem;font-family:'Syne',sans-serif;font-weight:700;font-size:.95rem;cursor:pointer;margin-top:.6rem;letter-spacing:.05em;display:none;}
.next-btn:hover{opacity:.85;}

/* RESULT */
#result{display:none;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;padding:2rem;}
.result-inner{max-width:500px;width:100%;text-align:center;}
.result-title{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;margin-bottom:.5rem;}
.result-score{font-family:'DM Mono',monospace;font-size:3.5rem;font-weight:500;margin:1rem 0;}
.result-score .denom{font-size:1.5rem;color:var(--muted);}
.result-breakdown{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin:1.5rem 0;}
.rb-item{background:var(--soft);padding:.8rem .5rem;font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted);text-align:center;}
.rb-item strong{display:block;font-size:1.3rem;margin-bottom:.2rem;}
.rb-item strong.g{color:var(--accent);}
.rb-item strong.r{color:var(--red);}
.rb-item strong.b{color:var(--blue);}
.result-btns{display:flex;flex-direction:column;gap:.5rem;margin-top:1rem;}
.r-btn{padding:.7rem;font-family:'Syne',sans-serif;font-weight:700;font-size:.9rem;cursor:pointer;letter-spacing:.05em;border:none;}
.r-btn.primary{background:var(--accent);color:#052e16;}
.r-btn.secondary{background:var(--soft);color:var(--text);border:1px solid var(--border);}
.r-btn:hover{opacity:.85;}
</style>
</head>
<body>

<!-- HOME -->
<div id="home">
  <div class="brand">期中<span>刷題</span></div>
  <div class="tagline">NKUST 114-2 · 大二實用英文</div>
  <div class="stat-row">
    <div class="stat"><strong id="total-count">158</strong>總題數</div>
    <div class="stat"><strong id="done-count" style="color:var(--accent)">0</strong>已作答</div>
    <div class="stat"><strong id="acc-pct" style="color:var(--gold)">—</strong>正確率</div>
  </div>
  <div class="type-grid">
    <div class="type-btn active" data-type="all" onclick="toggleType(this)">
      <span class="tb-icon">📚</span>全部
      <span class="tb-count" id="count-all">158題</span>
    </div>
    <div class="type-btn" data-type="vocab" onclick="toggleType(this)">
      <span class="tb-icon">📖</span>單字
      <span class="tb-count" id="count-vocab">70題</span>
    </div>
    <div class="type-btn" data-type="grammar" onclick="toggleType(this)">
      <span class="tb-icon">✏️</span>文法
      <span class="tb-count" id="count-grammar">22題</span>
    </div>
    <div class="type-btn" data-type="matching" onclick="toggleType(this)">
      <span class="tb-icon">🔗</span>配對
      <span class="tb-count" id="count-matching">28題</span>
    </div>
    <div class="type-btn" data-type="situation" onclick="toggleType(this)">
      <span class="tb-icon">💬</span>情境
      <span class="tb-count" id="count-situation">16題</span>
    </div>
    <div class="type-btn" data-type="listening" onclick="toggleType(this)">
      <span class="tb-icon">🎧</span>聽力
      <span class="tb-count" id="count-listening">22題</span>
    </div>
  </div>
  <button class="start-btn" onclick="startQuiz()">開始刷題 →</button>
</div>

<!-- QUIZ -->
<div id="quiz">
  <div class="quiz-inner">
    <div class="topbar">
      <button class="back-btn" onclick="goHome()">← 返回</button>
      <div class="progress-wrap"><div class="progress-bar" id="prog-bar"></div></div>
      <div class="prog-label" id="prog-label">0/0</div>
      <div class="score-label">✓<span class="sc" id="sc-correct">0</span> ✗<span class="sw" id="sc-wrong">0</span></div>
    </div>
    <div class="q-card">
      <div class="q-meta">
        <span class="q-type" id="q-type-badge"></span>
        <span class="q-id" id="q-id-label"></span>
      </div>
      <div id="script-area" style="display:none">
        <button class="tts-btn" id="tts-btn" onclick="toggleTTS()">▶ 朗讀對話</button>
        <div class="script-box" id="script-box"></div>
      </div>
      <div class="q-text" id="q-text"></div>
      <div class="opts" id="opts"></div>
      <div id="expl-area" style="display:none"></div>
    </div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">下一題 →</button>
  </div>
</div>

<!-- RESULT -->
<div id="result" style="display:flex">
  <div class="result-inner">
    <div class="result-title" id="result-title">完成！</div>
    <div class="result-score" id="result-score"></div>
    <div class="result-breakdown">
      <div class="rb-item"><strong class="g" id="rb-correct">0</strong>答對</div>
      <div class="rb-item"><strong class="r" id="rb-wrong">0</strong>答錯</div>
      <div class="rb-item"><strong class="b" id="rb-acc">0%</strong>正確率</div>
    </div>
    <div class="result-btns">
      <button class="r-btn primary" onclick="restartSame()">再刷一次（同類型）</button>
      <button class="r-btn secondary" onclick="goHome()">返回選題</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"id": "v001", "type": "vocab", "question": "「circulation」的中文意思是？", "options": ["發行量", "監視", "副刊", "社論"], "answer": "發行量", "explanation": "circulation = 報紙/雜誌的發行量。例：The newspaper has a large circulation.（這份報紙發行量很大。）監視=surveillance，副刊=supplement，社論=editorial。"}, {"id": "v002", "type": "vocab", "question": "「tabloid」的中文意思是？", "options": ["小報", "社論版", "特寫報導", "頭條新聞"], "answer": "小報", "explanation": "tabloid = 比一般報紙小、以聳動標題吸引讀者的小報。社論版=editorial page，特寫=feature，頭條=headline。"}, {"id": "v003", "type": "vocab", "question": "「editorial」的中文意思是？", "options": ["社論", "副刊", "特寫報導", "發行量"], "answer": "社論", "explanation": "editorial = 報紙社論，代表報社立場的文章。副刊=supplement，特寫=feature，發行量=circulation。"}, {"id": "v004", "type": "vocab", "question": "「supplement」的中文意思是？", "options": ["副刊；附冊", "社論版", "特寫報導", "小報"], "answer": "副刊；附冊", "explanation": "supplement = 附在主報內的副刊，通常是雜誌形式。社論版=editorial page，特寫=feature，小報=tabloid。"}, {"id": "v005", "type": "vocab", "question": "「sensationalism」的中文意思是？", "options": ["追求轟動效果；煽情主義", "新聞業", "社論", "發行量"], "answer": "追求轟動效果；煽情主義", "explanation": "sensationalism = 以誇大、聳動方式呈現新聞以吸引讀者，常見於tabloid小報。新聞業=journalism，社論=editorial，發行量=circulation。"}, {"id": "v006", "type": "vocab", "question": "「scandal」的中文意思是？", "options": ["醜聞", "謠言", "陰謀", "控訴"], "answer": "醜聞", "explanation": "scandal = 令人震驚的醜聞或醜事。謠言=rumor，陰謀=conspiracy，控訴=accusation。"}, {"id": "v007", "type": "vocab", "question": "「biased」的中文意思是？", "options": ["有偏見的；片面的", "平衡的", "客觀的", "公正的"], "answer": "有偏見的；片面的", "explanation": "biased = 立場不中立、偏向某一方，與balanced（平衡的）或objective（客觀的）相反。"}, {"id": "v008", "type": "vocab", "question": "「feature」在新聞媒體中的意思是？", "options": ["特寫；特別報導", "頭條新聞", "社論", "副刊"], "answer": "特寫；特別報導", "explanation": "feature = 深度報導某特定主題的特寫文章，比一般新聞報導更詳細。頭條=headline，社論=editorial，副刊=supplement。"}, {"id": "v009", "type": "vocab", "question": "「headline」的中文意思是？", "options": ["頭條新聞", "社論", "特寫報導", "新聞業"], "answer": "頭條新聞", "explanation": "headline = 報紙最顯眼的大標題新聞。社論=editorial，特寫=feature，新聞業=journalism。"}, {"id": "v010", "type": "vocab", "question": "「journalism」的中文意思是？", "options": ["新聞報導；新聞業", "社論版", "發行量", "小報"], "answer": "新聞報導；新聞業", "explanation": "journalism = 新聞業或新聞報導工作。社論版=editorial page，發行量=circulation，小報=tabloid。"}, {"id": "v011", "type": "vocab", "question": "「surveillance」的中文意思是？", "options": ["監視；監控", "調查", "報導", "偵探"], "answer": "監視；監控", "explanation": "surveillance = 對人或地點的持續監視或監控。調查=investigation，報導=reporting，偵探=detective。"}, {"id": "v012", "type": "vocab", "question": "「anonymous」的中文意思是？", "options": ["匿名的", "原創的", "合成的", "秘密的"], "answer": "匿名的", "explanation": "anonymous = 身份不公開的、匿名的。原創的=original，合成的=composite，秘密的=undercover/secret。"}, {"id": "v013", "type": "vocab", "question": "「composite」的中文意思是？", "options": ["合成的；由多個部分組成的", "原創的", "匿名的", "秘密的"], "answer": "合成的；由多個部分組成的", "explanation": "composite = 由兩張或以上圖片合成的，在S7.2聽力中，hoaxer解釋合成圖片（composite picture）的概念。原創的=original，匿名的=anonymous，秘密的=undercover。"}, {"id": "v014", "type": "vocab", "question": "「hoax」的中文意思是？", "options": ["欺騙；惡作劇", "謀殺", "醜聞", "調查"], "answer": "欺騙；惡作劇", "explanation": "hoax = 故意製造的欺騙或惡作劇，例如假照片（hoax picture）。謀殺=murder，醜聞=scandal，調查=investigation。"}, {"id": "v015", "type": "vocab", "question": "「hoaxer」的中文意思是？", "options": ["騙子；惡作劇者", "偵探", "新聞主播", "記者"], "answer": "騙子；惡作劇者", "explanation": "hoaxer = 製造hoax（欺騙/惡作劇）的人。偵探=detective，新聞主播=newscaster，記者=journalist/reporter。"}, {"id": "v016", "type": "vocab", "question": "「detective」的中文意思是？", "options": ["偵探", "記者", "騙子", "監視員"], "answer": "偵探", "explanation": "detective = 負責調查案件的偵探或便衣警察。記者=journalist，騙子=hoaxer，監視員=surveillance officer。"}, {"id": "v017", "type": "vocab", "question": "「allegedly」的中文意思是？", "options": ["據說；據稱", "顯著地", "特別地", "奇怪地"], "answer": "據說；據稱", "explanation": "allegedly = 據說，表示未經證實的說法，常用於新聞報導中。顯著地=strikingly，特別地=specifically，奇怪地=weirdly。"}, {"id": "v018", "type": "vocab", "question": "「newscaster」的中文意思是？", "options": ["新聞主播", "記者", "評論員", "編輯"], "answer": "新聞主播", "explanation": "newscaster = 在電視或廣播中播報新聞的主播。記者=journalist/reporter，評論員=commentator，編輯=editor。"}, {"id": "v019", "type": "vocab", "question": "「undercover」的中文意思是？", "options": ["秘密的；臥底的", "匿名的", "危險的", "已知的"], "answer": "秘密的；臥底的", "explanation": "undercover = 以秘密身份執行任務的，例如undercover agent（臥底特工）。匿名的=anonymous，危險的=dangerous，已知的=known。"}, {"id": "v020", "type": "vocab", "question": "「glimpse」的中文意思是？", "options": ["窺視；一瞥", "注視", "忽視", "審視"], "answer": "窺視；一瞥", "explanation": "glimpse = 短暫的一瞥，例如catch a glimpse of（瞥見）。注視=gaze，忽視=ignore，審視=scrutinize。"}, {"id": "v021", "type": "vocab", "question": "「fuel」作為動詞時的意思是？", "options": ["助長；刺激", "燃燒", "減少", "停止"], "answer": "助長；刺激", "explanation": "fuel (v.) = 助長、使某事物更強烈，例如fuel the controversy（助長爭議）。作為名詞fuel = 燃料，但作為動詞指助長。"}, {"id": "v022", "type": "vocab", "question": "「position」在新聞媒體語境中（表達立場時）的意思是？", "options": ["立場；觀點", "位置；地點", "工作；職位", "姿勢"], "answer": "立場；觀點", "explanation": "position = 在某議題上持有的立場或觀點，例如What's your position on this issue?。在新聞媒體語境中強調「立場」。"}, {"id": "v023", "type": "vocab", "question": "「postpone」的同義詞是？", "options": ["put off", "give up", "speed up", "carry out"], "answer": "put off", "explanation": "postpone = put off = 延遲、推遲。give up=放棄，speed up=加快，carry out=執行。筆記中明確標示 postpone = put off。"}, {"id": "v024", "type": "vocab", "question": "「assess」的中文意思是？", "options": ["評估", "探究", "背叛", "堅守"], "answer": "評估", "explanation": "assess = 仔細評估一個情況的詳細內容，與evaluate同義。探究=explore，背叛=betray，堅守=stick to。"}, {"id": "v025", "type": "vocab", "question": "「betray」的中文意思是？", "options": ["背叛", "評估", "延遲", "堅守"], "answer": "背叛", "explanation": "betray = 背叛、出賣，例如betray your principles（背叛自己的原則）。評估=assess，延遲=postpone，堅守=stick to。"}, {"id": "v026", "type": "vocab", "question": "「stick to」的中文意思是？", "options": ["堅守；忠於", "背叛", "延遲", "違背"], "answer": "堅守；忠於", "explanation": "stick to = 堅守、忠於，例如stick to your principles（忠於原則）。背叛=betray，延遲=postpone，違背=go against。"}, {"id": "v027", "type": "vocab", "question": "「stop at nothing」的中文意思是？", "options": ["不擇手段", "毫無進展", "停止一切", "三思而行"], "answer": "不擇手段", "explanation": "stop at nothing (phr.) = 為達目的不擇手段、什麼都肯做。毫無進展=go nowhere，三思而行=think twice before acting。"}, {"id": "v028", "type": "vocab", "question": "「insurance」的中文意思是？", "options": ["保險", "身分", "判決", "控告"], "answer": "保險", "explanation": "insurance = 保險，例如car insurance（汽車保險）、health insurance（健康保險）。身分=identity，判決=sentence，控告=accusation。"}, {"id": "v029", "type": "vocab", "question": "「sue」的中文意思是？", "options": ["控告；提告", "否認", "承認", "道歉"], "answer": "控告；提告", "explanation": "sue = 向法院提告、控告某人，例如The photographer could sue us.（攝影師可以控告我們。）否認=deny，承認=admit，道歉=apologize。"}, {"id": "v030", "type": "vocab", "question": "「identity」的中文意思是？", "options": ["身分", "個性", "身體", "地位"], "answer": "身分", "explanation": "identity = 個人身份，例如keep his identity secret（保密他的身份）。在S7.2聽力中，hoaxer要求保持匿名（remain anonymous/keep identity secret）。個性=personality，地位=status。"}, {"id": "v031", "type": "vocab", "question": "「heartless」的中文意思是？", "options": ["無情的", "勇敢的", "慷慨的", "害怕的"], "answer": "無情的", "explanation": "heartless = 冷酷無情的，例如在S8.3 Dictator Game中，Dominic說 I'm not heartless（我不是無情的人）。勇敢的=brave，慷慨的=generous，害怕的=afraid。"}, {"id": "v032", "type": "vocab", "question": "「short-changed」的中文意思是？", "options": ["受欺騙的；吃虧的", "慷慨的", "公平的", "滿足的"], "answer": "受欺騙的；吃虧的", "explanation": "short-changed = 被少找零、被欺騙、感覺吃虧的。在S8.3中Heather說 I feel a bit short-changed（我覺得有點吃虧）。慷慨的=generous，公平的=fair，滿足的=satisfied。"}, {"id": "v033", "type": "vocab", "question": "「ultimatum」的中文意思是？", "options": ["最後通牒", "最終決定", "極端手段", "最後機會"], "answer": "最後通牒", "explanation": "ultimatum = 最後通牒，即「限期服從，否則採取行動」的警告。課程中The Ultimatum Game（最後通牒遊戲）考驗人的公平感。最終決定=final decision，極端手段=extreme measures。"}, {"id": "v034", "type": "vocab", "question": "「dictator」的中文意思是？", "options": ["獨裁者", "決策者", "談判者", "記者"], "answer": "獨裁者", "explanation": "dictator = 獨裁者，擁有絕對控制權的人。The Dictator Game（獨裁者遊戲）中，決策者可以獨自決定金錢分配。決策者=decision-maker，談判者=negotiator，記者=journalist。"}, {"id": "v035", "type": "vocab", "question": "「generosity」的中文意思是？", "options": ["慷慨；大方", "貪婪", "平等", "侵略性"], "answer": "慷慨；大方", "explanation": "generosity = 願意付出、慷慨大方的特質。在S8.2中，Heather說Dominic was very kind and generous to give her half（慷慨地給了一半）。貪婪=greed，平等=equality，侵略性=aggression。"}, {"id": "v036", "type": "vocab", "question": "「aggression」的中文意思是？", "options": ["侵略性；威脅行為", "防衛", "慷慨", "平等"], "answer": "侵略性；威脅行為", "explanation": "aggression = 具有侵略性、威脅意味的行為，與defense（防衛）相對。在分配遊戲中，拒絕接受可能被視為aggression。慷慨=generosity，平等=equality。"}, {"id": "v037", "type": "vocab", "question": "「equality」的中文意思是？", "options": ["平等", "公平", "自由", "和平"], "answer": "平等", "explanation": "equality = 每個人享有相同的權利或待遇。在S8.2中，Heather接受$5因為感覺是equal split（平等分配）。公平=fairness/justice，自由=freedom，和平=peace。"}, {"id": "v038", "type": "vocab", "question": "「greed」的中文意思是？", "options": ["貪婪", "慷慨", "平等", "公平"], "answer": "貪婪", "explanation": "greed = 對金錢或物質的強烈欲望。在Dictator Game中，Dominic給自己$9可被視為greed（貪婪）。慷慨=generosity，平等=equality，公平=fairness。"}, {"id": "v039", "type": "vocab", "question": "「ecstatic」的中文意思是？", "options": ["狂喜的", "悲觀的", "沮喪的", "平靜的"], "answer": "狂喜的", "explanation": "ecstatic = 極度喜悅、狂喜的，比happy更強烈的情緒。悲觀的=pessimistic，沮喪的=depressed，平靜的=calm。"}, {"id": "v040", "type": "vocab", "question": "「shallow」的中文意思是？", "options": ["膚淺的", "深刻的", "樂觀的", "悲觀的"], "answer": "膚淺的", "explanation": "shallow = 思想膚淺的、不深刻的，與deep（深刻的）相反。深刻的=deep/profound，樂觀的=optimistic，悲觀的=pessimistic。"}, {"id": "v041", "type": "vocab", "question": "「overprotective」的中文意思是？", "options": ["過度保護的", "保護不足的", "過度樂觀的", "過度悲觀的"], "answer": "過度保護的", "explanation": "overprotective = 對他人（尤指孩子）保護過度的。在S6.6聽力中，主持人說Julia在手機使用上 being overprotective（對女兒過度保護）。"}, {"id": "v042", "type": "vocab", "question": "「humanity」的中文意思是？", "options": ["人類", "人道主義", "人性", "人口"], "answer": "人類", "explanation": "humanity = 人類（總稱），也有「人道主義」或「人性」之意。在此課程語境中主要指人類整體。人口=population。"}, {"id": "v043", "type": "vocab", "question": "「longevity」的中文意思是？", "options": ["長壽", "健康", "快樂", "成功"], "answer": "長壽", "explanation": "longevity = 長壽、長期存在。課程健康長壽單元討論如何維持longevity（長壽）。健康=health，快樂=happiness，成功=success。"}, {"id": "v044", "type": "vocab", "question": "「dread」的中文意思是？", "options": ["害怕；恐懼", "期待", "驚訝", "興奮"], "answer": "害怕；恐懼", "explanation": "dread = 對某事感到強烈的害怕或憂慮，例如dread the future（害怕未來）。期待=look forward to，驚訝=surprise，興奮=excitement。"}, {"id": "v045", "type": "vocab", "question": "「go nowhere」的中文意思是？", "options": ["毫無進展", "無處可去", "停留原地", "慢慢前進"], "answer": "毫無進展", "explanation": "go nowhere (phr.) = 毫無進展，指努力但沒有成果，是一個慣用語。注意這不是字面意思的「沒有去哪裡」。"}, {"id": "v046", "type": "vocab", "question": "「unrealistic」的中文意思是？（字首un-）", "options": ["不切實際的", "不可預測的", "不願意的", "不熟悉的"], "answer": "不切實際的", "explanation": "un- + realistic = unrealistic，不切實際的。不可預測=unpredictable，不願意=unwilling，不熟悉=unfamiliar。前綴un-表「否定」。"}, {"id": "v047", "type": "vocab", "question": "「unpredictable」的中文意思是？", "options": ["不可預測的", "不切實際的", "不健康的", "不滿足的"], "answer": "不可預測的", "explanation": "un- + predictable = unpredictable，不可預測的。不切實際=unrealistic，不健康=unhealthy，不滿足=dissatisfied（dis-前綴）。"}, {"id": "v048", "type": "vocab", "question": "「impatient」的中文意思是？（字首im-）", "options": ["急躁的；沒耐心的", "長生不老的", "不安全的", "不相關的"], "answer": "急躁的；沒耐心的", "explanation": "im- + patient = impatient，急躁、沒耐心的。前綴im-也出現在immortal（不朽的）。不安全=insecure（in-），不相關=irrelevant（ir-）。"}, {"id": "v049", "type": "vocab", "question": "「insecure」的中文意思是？（字首in-）", "options": ["不安全的；缺乏安全感的", "不合邏輯的", "不相關的", "急躁的"], "answer": "不安全的；缺乏安全感的", "explanation": "in- + secure = insecure，缺乏安全感的。不合邏輯=illogical（il-），不相關=irrelevant（ir-），急躁=impatient（im-）。"}, {"id": "v050", "type": "vocab", "question": "「illogical」的中文意思是？（字首il-）", "options": ["不合邏輯的", "不相關的", "不合法的", "不合理的"], "answer": "不合邏輯的", "explanation": "il- + logical = illogical，不合邏輯的。注意il-用在以l開頭的字根前。不相關=irrelevant（ir-），不合理=unreasonable（un-）。"}, {"id": "v051", "type": "vocab", "question": "「misinterpret」的中文意思是？（字首mis-）", "options": ["誤解；誤讀", "行為不當", "誤算", "誤導"], "answer": "誤解；誤讀", "explanation": "mis- + interpret = misinterpret，對某事的意思產生錯誤理解。行為不當=misbehave（同樣mis-前綴），誤算=miscalculate，誤導=mislead。"}, {"id": "v052", "type": "vocab", "question": "「stash」的中文意思是？", "options": ["藏匿；存放", "搶劫", "開採", "尋找"], "answer": "藏匿；存放", "explanation": "stash = 秘密地藏起來或存放，例如stash money（藏錢）。搶劫=robbery，開採=mine，尋找=search/look for。"}, {"id": "v053", "type": "vocab", "question": "「widow」的中文意思是？", "options": ["寡婦", "孤兒", "老人", "移民"], "answer": "寡婦", "explanation": "widow = 丈夫已去世的女性（寡婦）。對應的男性是widower（鰥夫）。孤兒=orphan，老人=elderly person，移民=immigrant。"}, {"id": "v054", "type": "vocab", "question": "「maintenance」的中文意思是？", "options": ["維修；保養", "安裝", "建設", "破壞"], "answer": "維修；保養", "explanation": "maintenance = 維持運作所需的定期修護保養，例如car maintenance（汽車保養）。安裝=installation，建設=construction，破壞=destruction。"}, {"id": "v055", "type": "vocab", "question": "「instinct」的中文意思是？", "options": ["本能；直覺", "習慣", "思考", "決定"], "answer": "本能；直覺", "explanation": "instinct = 不需思考就能感知或行動的本能，例如maternal instinct（母性本能）。習慣=habit，思考=thought，決定=decision。"}, {"id": "v056", "type": "vocab", "question": "「ladle」的中文意思是？", "options": ["長柄湯匙", "刀", "叉子", "筷子"], "answer": "長柄湯匙", "explanation": "ladle = 長柄大湯匙，用於盛湯。在S7.4老虎故事中，女性用wooden soup ladle（木湯匙）打退老虎。刀=knife，叉子=fork，筷子=chopsticks。"}, {"id": "v057", "type": "vocab", "question": "「robbery」的中文意思是？", "options": ["搶劫", "醜聞", "欺騙", "謀殺"], "answer": "搶劫", "explanation": "robbery = 用暴力或威脅搶奪他人財物的犯罪。醜聞=scandal，欺騙=hoax/fraud，謀殺=murder。"}, {"id": "v058", "type": "vocab", "question": "「malfunction」的中文意思是？", "options": ["故障；運作失常", "維修", "保養", "啟動"], "answer": "故障；運作失常", "explanation": "malfunction = 機器或系統運作不正常、發生故障。課文中，malfunctioning = going wrong（出問題）。維修=maintenance/repair，保養=maintenance，啟動=start up。"}, {"id": "v059", "type": "vocab", "question": "「enterprise」的中文意思是？", "options": ["公司；企業", "政府", "媒體", "機構"], "answer": "公司；企業", "explanation": "enterprise = 公司、企業，也指「進取心、創業精神」。在Note1的miscellaneous單元中出現。政府=government，媒體=media，機構=institution/organization。"}, {"id": "v060", "type": "vocab", "question": "「milestones」的中文意思是？", "options": ["重大事件；里程碑", "里程表", "路標", "記錄"], "answer": "重大事件；里程碑", "explanation": "milestones = 人生或發展過程中的重要里程碑、關鍵時刻。里程表=odometer，路標=road sign，記錄=record。"}, {"id": "v061", "type": "vocab", "question": "「mediocrity」的中文意思是？", "options": ["平凡；平庸", "卓越", "優秀", "失敗"], "answer": "平凡；平庸", "explanation": "mediocrity = 只達到普通水準、平淡無奇的狀態，與excellence（卓越）相反。卓越=excellence，優秀=brilliance，失敗=failure。"}, {"id": "v062", "type": "vocab", "question": "「peers」的中文意思是？", "options": ["同輩；同齡人", "前輩", "晚輩", "上司"], "answer": "同輩；同齡人", "explanation": "peers = 與自己年齡、地位相當的同輩，例如peer pressure（同儕壓力）。前輩=senior，晚輩=junior，上司=superior/boss。"}, {"id": "v063", "type": "vocab", "question": "「deteriorate」的同義詞是？", "options": ["worsen", "improve", "maintain", "evaluate"], "answer": "worsen", "explanation": "deteriorate = worsen = 惡化、變糟。筆記中明確標示 deteriorate = worsen。improve=改善，maintain=維持，evaluate=評估。"}, {"id": "v064", "type": "vocab", "question": "「extraordinary」的中文意思是？", "options": ["異常的；非凡的", "普通的", "一般的", "常見的"], "answer": "異常的；非凡的", "explanation": "extraordinary = 超出尋常的、非凡的，比unusual更強烈。在S7.2中，hoaxer描述飛機起落架男子圖是extraordinary sight（非凡的景象）。普通的=ordinary，一般的=normal，常見的=common。"}, {"id": "v065", "type": "vocab", "question": "「cliché」的中文意思是？", "options": ["陳腔濫調", "創意", "原創", "新穎"], "answer": "陳腔濫調", "explanation": "cliché = 已被過度使用而失去新意的陳腔濫調。在S7.2中，hoaxer說鯊魚圖是a cliché（陳腔濫調），因為太多類似的假圖了。創意=creativity，原創=original，新穎=novel。"}, {"id": "v066", "type": "vocab", "question": "「befriend」的中文意思是？", "options": ["和～做朋友", "與～作敵", "忽視", "失去聯絡"], "answer": "和～做朋友", "explanation": "befriend = 主動與某人建立友誼，例如befriend a stranger（主動和陌生人交朋友）。與～作敵=make enemies with，忽視=ignore，失去聯絡=lose touch。"}, {"id": "v067", "type": "vocab", "question": "「hurricane」的中文意思是？", "options": ["颶風", "龍捲風", "暴風雨", "地震"], "answer": "颶風", "explanation": "hurricane = 大西洋或太平洋地區的強烈熱帶氣旋（颶風）。龍捲風=tornado，暴風雨=storm/typhoon，地震=earthquake。"}, {"id": "v068", "type": "vocab", "question": "「appealing」的中文意思是？", "options": ["吸引人的", "令人厭惡的", "平凡的", "複雜的"], "answer": "吸引人的", "explanation": "appealing = 有魅力、吸引人的，例如an appealing story（吸引人的故事）。令人厭惡的=repulsive，平凡的=ordinary，複雜的=complex。"}, {"id": "v069", "type": "vocab", "question": "「guideline」的中文意思是？", "options": ["指導方針", "法律", "規定", "禁令"], "answer": "指導方針", "explanation": "guideline = 提供建議和方向的指導方針（不像law那樣強制）。在S6.6中，主持人說parents should set guidelines（父母應設立指導方針）。法律=law，規定=rule，禁令=ban。"}, {"id": "v070", "type": "vocab", "question": "「remarkable」的中文意思是？", "options": ["值得注意的；非凡的", "一般的", "可忽略的", "無關緊要的"], "answer": "值得注意的；非凡的", "explanation": "remarkable = 令人印象深刻、值得特別注意的，例如a remarkable achievement（非凡的成就）。一般的=ordinary，可忽略的=negligible，無關緊要的=insignificant。"}, {"id": "g001", "type": "grammar", "question": "選出文法正確的句子（admit 的用法）", "options": ["He admitted to steal the money.", "He admitted stealing the money.", "He admitted steal the money.", "He admitted to stolen the money."], "answer": "He admitted stealing the money.", "explanation": "admit 後面只能接 Ving（動名詞），不能接 to V（不定詞）。正確句型：admit + Ving。✓ He admitted stealing it. ✗ He admitted to steal it.（這是最常見的考試陷阱！）"}, {"id": "g002", "type": "grammar", "question": "選出文法正確的句子（deny 的用法）", "options": ["She denied to do anything wrong.", "She denied doing anything wrong.", "She denied did anything wrong.", "She denied to have done anything wrong."], "answer": "She denied doing anything wrong.", "explanation": "deny 後面只能接 Ving，不能接 to V。✓ deny + Ving。✗ deny + to V。deny 和 admit 是同一類，兩者都只接動名詞。"}, {"id": "g003", "type": "grammar", "question": "完成句子，選出正確動詞形式：\nShe apologized ___ late to the meeting.", "options": ["for being", "to be", "being", "for be"], "answer": "for being", "explanation": "apologize 固定搭配介系詞 for，for 後接動名詞 Ving。句型：apologize for + Ving。✓ She apologized for being late. ✗ apologize to be / apologize being（缺少 for）。"}, {"id": "g004", "type": "grammar", "question": "選出文法正確的句子（accuse 的用法）", "options": ["They accused him to fake the photos.", "They accused him of faking the photos.", "They accused him faking the photos.", "They accused of him faking the photos."], "answer": "They accused him of faking the photos.", "explanation": "accuse 固定搭配句型：accuse + sb + of + Ving。注意介系詞是 of，後接動名詞。✓ accuse sb of doing sth。✗ accuse sb to do。"}, {"id": "g005", "type": "grammar", "question": "選出文法正確的句子（promise 的用法）", "options": ["He promised paying the fine.", "He promised to pay the fine.", "He promised pay the fine.", "He promised of paying the fine."], "answer": "He promised to pay the fine.", "explanation": "promise 後接不定詞 to V，不接動名詞 Ving。句型：promise + to V。✓ He promised to pay. ✗ promise paying / promise pay。"}, {"id": "g006", "type": "grammar", "question": "選出文法正確的句子（refuse 的用法）", "options": ["She refused believing the email was real.", "She refused to believe the email was real.", "She refused believe the email was real.", "She refused of believing the email was real."], "answer": "She refused to believe the email was real.", "explanation": "refuse 後接不定詞 to V，不接動名詞。句型：refuse + to V。✓ She refused to believe. ✗ refuse believing / refuse believe。"}, {"id": "g007", "type": "grammar", "question": "選出文法正確的句子（agree 的用法）", "options": ["He agreed paying the fine.", "He agreed to pay the fine.", "He agreed pay the fine.", "He agreed for paying the fine."], "answer": "He agreed to pay the fine.", "explanation": "agree 後接不定詞 to V，不接動名詞。句型：agree + to V。✓ He agreed to pay. 這是課文中 Les Brown 案例的關鍵用法：agreed to pay fine（同意繳罰款）。"}, {"id": "g008", "type": "grammar", "question": "選出文法正確的句子（persuade 的用法）", "options": ["She persuaded him stopping the behavior.", "She persuaded him to stop the behavior.", "She persuaded him stop the behavior.", "She persuaded him of stopping the behavior."], "answer": "She persuaded him to stop the behavior.", "explanation": "persuade 的句型：persuade + sb + to V（不定詞）。✓ persuade sb to do sth。課文：his ex-wife persuaded him to stop（前妻說服他停止）。"}, {"id": "g009", "type": "grammar", "question": "選出文法正確的句子（warn 的用法）", "options": ["The authorities warned him stopping the behavior.", "The authorities warned him to stop the behavior.", "The authorities warned him stop the behavior.", "The authorities warned him of stopping the behavior."], "answer": "The authorities warned him to stop the behavior.", "explanation": "warn 的句型：warn + sb + to V（不定詞）。✓ warn sb to do sth。也可用 warn sb never to do sth（警告不要做某事）。"}, {"id": "g010", "type": "grammar", "question": "選出文法正確的句子（suggest 的用法）", "options": ["He suggested to ask someone else.", "He suggested asking someone else.", "He suggested ask someone else.", "He suggested of asking someone else."], "answer": "He suggested asking someone else.", "explanation": "suggest 後接動名詞 Ving，不接不定詞 to V。句型：suggest + Ving。✓ suggest asking。✗ suggest to ask（這是非常常見的錯誤！）"}, {"id": "g011", "type": "grammar", "question": "選出文法正確的句子（threaten 的用法）", "options": ["She threatened reporting her boss.", "She threatened to report her boss.", "She threatened report her boss.", "She threatened of reporting her boss."], "answer": "She threatened to report her boss.", "explanation": "threaten 後接不定詞 to V，不接動名詞。句型：threaten + to V。✓ threaten to do sth。✗ threaten doing / threaten of doing。"}, {"id": "g012", "type": "grammar", "question": "選出文法正確的句子（offer 的用法）", "options": ["He offered doing it if she gives credit.", "He offered to do it if she gives credit.", "He offered do it if she gives credit.", "He offered of doing it if she gives credit."], "answer": "He offered to do it if she gives credit.", "explanation": "offer 後接不定詞 to V。句型：offer + to V。✓ offer to do sth。✗ offer doing / offer of doing。"}, {"id": "g013", "type": "grammar", "question": "完成句子（否定動名詞）：\nShe apologized ___ her promise.", "options": ["for not keeping", "for not to keep", "to not keep", "not for keeping"], "answer": "for not keeping", "explanation": "否定動名詞的結構：for + not + Ving。不是 not for Ving，也不是 for not to V。✓ apologize for not keeping（為沒有遵守而道歉）。not 必須放在動名詞前。"}, {"id": "g014", "type": "grammar", "question": "選出文法正確的句子（make sb do）", "options": ["She made him to admit the truth.", "She made him admit the truth.", "She made him admitting the truth.", "She made him admitted the truth."], "answer": "She made him admit the truth.", "explanation": "make sb do（使役動詞）後接原形動詞，不加 to。句型：make + sb + V（原形）。✓ make him admit。✗ make him to admit / make him admitting。"}, {"id": "g015", "type": "grammar", "question": "以下哪個動詞後面只能接 Ving，不能接 to V？", "options": ["promise", "admit", "agree", "refuse"], "answer": "admit", "explanation": "admit 和 deny 後面只能接 Ving（動名詞）。promise、agree、refuse 後面接 to V（不定詞）。口訣：admit/deny → Ving；promise/agree/refuse → to V。"}, {"id": "g016", "type": "grammar", "question": "以下哪個動詞後面接 Ving，而非 to V？", "options": ["threaten", "offer", "suggest", "refuse"], "answer": "suggest", "explanation": "suggest 後接動名詞 Ving。threaten、offer、refuse 後接不定詞 to V。口訣：suggest/admit/deny → Ving；promise/agree/refuse/threaten/offer → to V。"}, {"id": "g017", "type": "grammar", "question": "選出文法正確的句子（apologize 否定形式）", "options": ["He apologized for not coming on time.", "He apologized not to come on time.", "He apologized to not coming on time.", "He apologized for not to come on time."], "answer": "He apologized for not coming on time.", "explanation": "apologize for + Ving 的否定形式是 for + not + Ving。not 放在動名詞前面，不是放在 for 前，也不用 to V。"}, {"id": "g018", "type": "grammar", "question": "完成句子（warn + never）：\nShe warned him ___ it again.", "options": ["never doing", "never to do", "to never doing", "for never doing"], "answer": "never to do", "explanation": "warn sb to V 的句型，加入 never 後成為 warn sb never to do sth（警告某人永遠不要做某事）。never 插入 to 和動詞之間。這是Situation 2課文的句型：warn him/her never to do it again。"}, {"id": "g019", "type": "grammar", "question": "選出文法正確的句子（accuse 否定句）", "options": ["She accused him to not tell the truth.", "She accused him of not telling the truth.", "She accused him not telling the truth.", "She accused him for not telling the truth."], "answer": "She accused him of not telling the truth.", "explanation": "accuse sb of Ving 的否定形式：accuse sb of not Ving。介系詞固定是 of，not 放在動名詞前。✓ accuse him of not telling。"}, {"id": "g020", "type": "grammar", "question": "哪一個句子的動詞用法是錯誤的？", "options": ["He agreed to pay the fine.", "She denied doing anything wrong.", "They suggested to leave immediately.", "She apologized for being late."], "answer": "They suggested to leave immediately.", "explanation": "suggest 後面只能接 Ving，不能接 to V。✗ suggest to leave → ✓ suggest leaving。其他三句都正確：agree to V, deny Ving, apologize for Ving。"}, {"id": "g021", "type": "grammar", "question": "完成句子：\nThe boss offered ___ a bonus if we finished early.", "options": ["giving", "to give", "give", "of giving"], "answer": "to give", "explanation": "offer 後接不定詞 to V。句型：offer + to V。✓ The boss offered to give a bonus. ✗ offered giving / offered give。"}, {"id": "g022", "type": "grammar", "question": "選出文法正確的句子（deny/admit 雙重陷阱）", "options": ["He denied to take the money, but admitted to spend it.", "He denied taking the money, but admitted spending it.", "He denied to take the money, but admitted spending it.", "He denied taking the money, but admitted to spend it."], "answer": "He denied taking the money, but admitted spending it.", "explanation": "deny 和 admit 兩者都只接 Ving，不接 to V。✓ denied taking + admitted spending。兩個都必須是動名詞形式，這是常見的複合陷阱題。"}, {"id": "m001", "type": "matching", "question": "哪個詞組符合以下定義？\n「hesitating or making mistakes when speaking」", "options": ["stumbling over their words", "technical hiccups", "blunders", "malfunctioning"], "answer": "stumbling over their words", "explanation": "stumble over one's words = 說話結結巴巴、口誤。technical hiccups = 機器小問題，blunders = 人為錯誤，malfunctioning = 機器故障。"}, {"id": "m002", "type": "matching", "question": "哪個單字符合以下定義？\n「happen suddenly and cause damage」", "options": ["strike", "stumble", "malfunction", "rolling"], "answer": "strike", "explanation": "strike = 突然發生並造成破壞（如颶風、閃電等天災突然來襲）。stumble = 絆倒，malfunction = 故障，rolling = 持續的。"}, {"id": "m003", "type": "matching", "question": "哪個詞組符合以下定義？\n「small problems with machines」", "options": ["technical hiccups", "blunders", "malfunctioning", "stumbling over their words"], "answer": "technical hiccups", "explanation": "technical hiccups = 機器的小問題（hiccup原意是打嗝，引申為小障礙）。blunders = 人為錯誤，malfunctioning = 嚴重故障，stumbling = 說話結巴。"}, {"id": "m004", "type": "matching", "question": "哪個單字符合以下定義？\n「continuous」（廣播術語）", "options": ["rolling", "striking", "blundering", "stumbling"], "answer": "rolling", "explanation": "rolling = 持續的、不停的，如rolling coverage（持續報導）。striking = 打擊，blundering = 犯錯，stumbling = 絆倒。"}, {"id": "m005", "type": "matching", "question": "哪個單字符合以下定義？\n「mistakes」（廣播/播報中的人為失誤）", "options": ["blunders", "hiccups", "glitches", "malfunctions"], "answer": "blunders", "explanation": "blunders = 明顯的錯誤、失誤，常指人為疏失。hiccups = 小問題，glitches = 技術小故障，malfunctions = 機器故障（較嚴重）。"}, {"id": "m006", "type": "matching", "question": "哪個單字符合以下定義？\n「going wrong (for a machine)」", "options": ["malfunctioning", "stumbling", "blundering", "striking"], "answer": "malfunctioning", "explanation": "malfunctioning = 機器運作不正常、故障中（malfunction = mal（壞）+ function（運作））。stumbling = 說話結巴，blundering = 犯錯，striking = 突然發生。"}, {"id": "m007", "type": "matching", "question": "哪個單字符合以下定義？\n「a popular newspaper, half the size, with few serious stories」", "options": ["tabloid", "editorial", "supplement", "feature"], "answer": "tabloid", "explanation": "tabloid = 小報，版面比一般報紙小一半，以聳動新聞和八卦為主，嚴肅新聞較少。editorial = 社論，supplement = 副刊，feature = 特寫。"}, {"id": "m008", "type": "matching", "question": "哪個詞組符合以下定義？\n「the section that gives the paper's opinion」", "options": ["editorial page", "supplement", "feature", "headline"], "answer": "editorial page", "explanation": "editorial page = 社論版，是報紙表達立場和意見的版面。supplement = 副刊，feature = 特寫，headline = 頭條。"}, {"id": "m009", "type": "matching", "question": "哪個單字符合以下定義？\n「a special report or article about a topic」", "options": ["feature", "editorial", "tabloid", "circulation"], "answer": "feature", "explanation": "feature = 針對特定主題深入撰寫的特別報導或特寫文章。editorial = 社論（表達立場），tabloid = 小報，circulation = 發行量。"}, {"id": "m010", "type": "matching", "question": "哪個單字符合以下定義？\n「giving a single point of view, unfairly」", "options": ["biased", "balanced", "sensational", "anonymous"], "answer": "biased", "explanation": "biased = 偏頗的、不公平地只呈現一方觀點。balanced（平衡的）是其反義詞，sensational = 聳動的，anonymous = 匿名的。"}, {"id": "m011", "type": "matching", "question": "哪個單字符合以下定義？\n「an extra section of a newspaper, often a magazine」", "options": ["supplement", "editorial", "feature", "edition"], "answer": "supplement", "explanation": "supplement = 附在主報內的副刊，通常是雜誌形式。editorial = 社論，feature = 特寫，edition = 版本/當天發行的那批報紙。"}, {"id": "m012", "type": "matching", "question": "哪個單字符合以下定義？\n「reporting news to make it sound as exciting as possible」", "options": ["sensationalism", "journalism", "editorial", "circulation"], "answer": "sensationalism", "explanation": "sensationalism = 以誇大、聳動方式呈現新聞以吸引讀者。journalism = 新聞業（中性），editorial = 社論，circulation = 發行量。"}, {"id": "m013", "type": "matching", "question": "哪個單字符合以下定義？\n「the set of newspapers published at the same time」", "options": ["edition", "circulation", "supplement", "headline"], "answer": "edition", "explanation": "edition = 同一時間印刷發行的一批報紙（版本），例如the morning edition（晨報）。circulation = 發行量（數量），supplement = 副刊，headline = 頭條。"}, {"id": "m014", "type": "matching", "question": "哪個單字符合以下定義？\n「the number of newspapers sold in a day or week」", "options": ["circulation", "edition", "distribution", "publication"], "answer": "circulation", "explanation": "circulation = 報紙每日或每週的銷售/發行數量。edition = 某次出版的版本（非數量），distribution = 配送行為，publication = 出版物（泛稱）。"}, {"id": "m015", "type": "matching", "question": "哪個單字符合以下定義？\n「being kind and willing to give」", "options": ["generosity", "aggression", "greed", "equality"], "answer": "generosity", "explanation": "generosity = 慷慨、樂於給予的特質。aggression = 侵略性，greed = 貪婪（想要更多），equality = 平等（人人相同）。"}, {"id": "m016", "type": "matching", "question": "哪個單字符合以下定義？\n「threatening behavior」", "options": ["aggression", "generosity", "equality", "fairness"], "answer": "aggression", "explanation": "aggression = 具有威脅性或攻擊性的行為。generosity = 慷慨，equality = 平等，fairness = 公平。"}, {"id": "m017", "type": "matching", "question": "哪個單字符合以下定義？\n「a situation where people have the same rights」", "options": ["equality", "fairness", "justice", "balance"], "answer": "equality", "explanation": "equality = 每個人享有相同的權利和待遇（強調「相同」）。fairness/justice = 公平、正義（強調合理），balance = 平衡。"}, {"id": "m018", "type": "matching", "question": "哪個單字符合以下定義？\n「strong desire for more money, food or other things」", "options": ["greed", "ambition", "desire", "aggression"], "answer": "greed", "explanation": "greed = 對財物的強烈且過度的欲望（貪婪）。ambition = 野心（可以是正面的），desire = 欲望（中性），aggression = 侵略行為。"}, {"id": "m019", "type": "matching", "question": "哪個單字符合以下定義？\n「a company or business」", "options": ["enterprise", "mediocrity", "milestone", "peer"], "answer": "enterprise", "explanation": "enterprise = 公司、企業，也可以表示「創業精神」或「大型計畫」。mediocrity = 平庸，milestone = 里程碑，peer = 同輩。"}, {"id": "m020", "type": "matching", "question": "哪個單字符合以下定義？\n「constantly changing」", "options": ["ever-shifting", "ever-growing", "ever-lasting", "ever-present"], "answer": "ever-shifting", "explanation": "ever-shifting = 不斷變化的（ever- 表「一直」，shifting = 移動/改變）。ever-growing = 持續增長，ever-lasting = 永久的，ever-present = 無處不在的。"}, {"id": "m021", "type": "matching", "question": "哪個單字符合以下定義？\n「important events in the development of something」", "options": ["milestones", "enterprise", "mediocrity", "peers"], "answer": "milestones", "explanation": "milestones = 某項發展過程中的重要里程碑或關鍵事件。enterprise = 企業，mediocrity = 平庸，peers = 同輩。"}, {"id": "m022", "type": "matching", "question": "哪個單字符合以下定義？\n「average quality」", "options": ["mediocrity", "excellence", "brilliance", "superiority"], "answer": "mediocrity", "explanation": "mediocrity = 只達到平均水準、平庸無奇。excellence = 卓越，brilliance = 出色，superiority = 優越，三者均表示高水準，與mediocrity相反。"}, {"id": "m023", "type": "matching", "question": "哪個單字符合以下定義？\n「people who are the same age or have the same status」", "options": ["peers", "seniors", "juniors", "mentors"], "answer": "peers", "explanation": "peers = 與自己年齡或地位相近的同輩（如 peer pressure = 同儕壓力）。seniors = 前輩/年長者，juniors = 晚輩，mentors = 導師。"}, {"id": "m024", "type": "matching", "question": "哪個詞組符合以下定義？\n「choose to do one thing or another」（做出決定）", "options": ["arrive at / reach a decision", "put off / postpone", "stick to your principles", "go against your principles"], "answer": "arrive at / reach a decision", "explanation": "arrive at / reach a decision = 做出決定（經過思考後選擇）。put off = 延遲決定，stick to your principles = 忠於原則，go against your principles = 違背原則。"}, {"id": "m025", "type": "matching", "question": "哪個詞組符合以下定義？\n「be faithful to what you believe is right」", "options": ["stick to your principles", "go against your principles", "put off your decision", "evaluate the situation"], "answer": "stick to your principles", "explanation": "stick to your principles = 忠於並堅守自己的原則。go against your principles = 做違背原則的事（反義），put off = 延遲，evaluate = 評估。"}, {"id": "m026", "type": "matching", "question": "哪個詞組符合以下定義？\n「do something that you don't believe is right」", "options": ["go against your principles", "stick to your principles", "follow your instincts", "reach a decision"], "answer": "go against your principles", "explanation": "go against your principles = 做出違背自己原則或信念的事。stick to your principles = 堅守原則（相反），follow your instincts = 跟隨直覺，reach a decision = 做出決定。"}, {"id": "m027", "type": "matching", "question": "哪個詞組符合以下定義？\n「look at a situation in detail」", "options": ["evaluate / assess", "explore / look into", "postpone / put off", "arrive at / reach"], "answer": "evaluate / assess", "explanation": "evaluate / assess = 仔細評估情況的細節（詳細看）。explore / look into = 探究情況（做判斷），postpone / put off = 延遲，arrive at / reach = 做出決定。"}, {"id": "m028", "type": "matching", "question": "哪個詞組符合以下定義？\n「judge a situation」", "options": ["explore / look into", "evaluate / assess", "stick to / follow", "go against / betray"], "answer": "explore / look into", "explanation": "explore / look into = 探究情況以做出判斷。evaluate / assess = 詳細評估（更注重細節分析），stick to / follow = 忠於，go against / betray = 違背。"}, {"id": "s001", "type": "situation", "question": "Situation 1（同事要脅）：A co-worker has an embarrassing photo and threatens to show your boss unless you pay money.\n\n完成句子，選出正確動詞形式：\nI ___ to pay the money.", "options": ["agreed", "admitted", "suggested", "denied"], "answer": "agreed", "explanation": "agree 後接 to V，表示同意做某事：agree to pay（同意付款）。admit 後接 Ving，suggest 後接 Ving，deny 後接 Ving，三者均不符合此句型，且語意也不符情境。"}, {"id": "s002", "type": "situation", "question": "Situation 1（同事要脅）：完成句子，選出正確動詞形式：\nI deny ___ anything wrong.", "options": ["doing", "to do", "did", "done"], "answer": "doing", "explanation": "deny 後面固定接 Ving（動名詞），不能接 to V（不定詞）。✓ deny doing。✗ deny to do。這是課程重點陷阱之一，deny/admit 都只接 Ving。"}, {"id": "s003", "type": "situation", "question": "Situation 1（同事要脅）：完成句子，選出正確動詞形式：\nI apologize ___ stupidly.", "options": ["for acting", "to act", "of acting", "act"], "answer": "for acting", "explanation": "apologize 固定搭配介系詞 for，後接 Ving：apologize for acting（為舉止愚蠢道歉）。✓ apologize for Ving。✗ apologize to V / apologize of Ving（介系詞錯誤）。"}, {"id": "s004", "type": "situation", "question": "Situation 1（同事要脅）：以下哪個句子使用了正確的 reporting verb 句型？", "options": ["She agreed paying the money.", "She agreed to pay the money.", "She agreed to paying the money.", "She agreed of paying the money."], "answer": "She agreed to pay the money.", "explanation": "agree 後接不定詞 to V（原形動詞），不接 Ving。✓ agreed to pay。✗ agreed paying / agreed to paying（to 後應接原形，不接 Ving）/ agreed of paying（介系詞錯）。"}, {"id": "s005", "type": "situation", "question": "Situation 2（好友背叛）：Someone shows you an email from your best friend full of negative comments.\n\n完成句子：\nI accuse my friend ___ you.", "options": ["of betraying", "to betray", "for betraying", "betraying"], "answer": "of betraying", "explanation": "accuse 固定句型：accuse sb of Ving。介系詞必須是 of，後接動名詞。✓ accuse of betraying。✗ accuse to betray / accuse for betraying（介系詞錯）/ accuse betraying（缺介系詞）。"}, {"id": "s006", "type": "situation", "question": "Situation 2（好友背叛）：完成句子，選出正確動詞形式：\nI refuse ___ that the email is real.", "options": ["to believe", "believing", "of believing", "believe"], "answer": "to believe", "explanation": "refuse 後接不定詞 to V，不接動名詞 Ving。✓ refuse to believe（拒絕相信）。✗ refuse believing / refuse of believing（介系詞多餘）/ refuse believe（缺 to）。"}, {"id": "s007", "type": "situation", "question": "Situation 2（好友背叛）：完成句子，選出正確動詞形式：\nI make my friend admit ___ the email.", "options": ["writing", "to write", "write", "written"], "answer": "writing", "explanation": "admit 後接動名詞 Ving：admit writing（承認寫了這封信）。make sb admit Ving（使某人承認做了某事）。✗ admit to write（to V不適用）/ admit write（缺動名詞形式）。"}, {"id": "s008", "type": "situation", "question": "Situation 2（好友背叛）：完成句子，選出正確動詞形式：\nI warn him/her ___ it again.", "options": ["never to do", "never doing", "to never doing", "for never doing"], "answer": "never to do", "explanation": "warn sb to V 的句型，加入 never 後成為 warn sb never to do sth（警告某人永遠不要做某事）。never 插入 to 和動詞之間，是課文Situation 2的直接句型。"}, {"id": "s009", "type": "situation", "question": "Situation 3（承諾未兌現）：You promised to take a friend to an expensive restaurant but now don't have time or money.\n\n完成句子：\nI promise ___ her, but next year.", "options": ["to take", "taking", "take", "to taking"], "answer": "to take", "explanation": "promise 後接不定詞 to V：promise to take（承諾帶她去）。✓ promise to V。✗ promise Ving（promise不接動名詞）/ promise V（缺 to）/ promise to taking（to 後接原形，不接 Ving）。"}, {"id": "s010", "type": "situation", "question": "Situation 3（承諾未兌現）：完成句子，選出正確動詞形式：\nI persuade her ___ to a cheaper restaurant.", "options": ["to go", "going", "go", "of going"], "answer": "to go", "explanation": "persuade 的句型：persuade sb to V（說服某人做某事）。✓ persuade her to go。✗ persuade her going / persuade her go（缺 to）/ persuade her of going（介系詞錯）。"}, {"id": "s011", "type": "situation", "question": "Situation 3（承諾未兌現）：完成句子，選出正確動詞形式：\nI apologize ___ my promise.", "options": ["for not keeping", "to not keep", "for not to keep", "not keeping"], "answer": "for not keeping", "explanation": "apologize for + Ving 的否定形式：for + not + Ving。✓ apologize for not keeping（為沒有遵守承諾道歉）。not 放在動名詞前，不是放在 for 前或改用 to V。"}, {"id": "s012", "type": "situation", "question": "Situation 3（承諾未兌現）：以下哪個句子的動詞形式是正確的？", "options": ["She apologized for not keeping her promise.", "She apologized to not keep her promise.", "She apologized for not to keep her promise.", "She apologized of not keeping her promise."], "answer": "She apologized for not keeping her promise.", "explanation": "apologize for + Ving，否定時為 for + not + Ving。✓ apologized for not keeping。✗ apologized to not keep（介系詞錯，應為 for）/ apologized of not keeping（介系詞錯）。"}, {"id": "s013", "type": "situation", "question": "Situation 4（老闆要求代勞）：Your boss offers a bonus if you write a report under her name and she takes full credit.\n\n完成句子：\nI offer ___ it, but only if she gives me credit too.", "options": ["to do", "doing", "do", "of doing"], "answer": "to do", "explanation": "offer 後接不定詞 to V：offer to do（提出做某事）。✓ offer to do。✗ offer doing（offer不接動名詞）/ offer do（缺 to）/ offer of doing（介系詞多餘）。"}, {"id": "s014", "type": "situation", "question": "Situation 4（老闆要求代勞）：完成句子，選出正確動詞形式：\nI suggest ___ someone else.", "options": ["asking", "to ask", "ask", "to asking"], "answer": "asking", "explanation": "suggest 後接動名詞 Ving，不接不定詞 to V。✓ suggest asking（建議找別人）。✗ suggest to ask（非常常見的錯誤！）/ suggest ask（缺動名詞形式）。"}, {"id": "s015", "type": "situation", "question": "Situation 4（老闆要求代勞）：完成句子，選出正確動詞形式：\nI threaten ___ my boss to her boss.", "options": ["to report", "reporting", "report", "of reporting"], "answer": "to report", "explanation": "threaten 後接不定詞 to V：threaten to report（威脅要舉報）。✓ threaten to V。✗ threaten Ving（threaten不接動名詞）/ threaten of reporting（介系詞多餘）。"}, {"id": "s016", "type": "situation", "question": "Situation 4（老闆要求代勞）：以下哪組動詞搭配全部正確？", "options": ["suggest to ask, threaten reporting, offer doing", "suggest asking, threaten to report, offer to do", "suggest asking, threaten reporting, offer to do", "suggest to ask, threaten to report, offer doing"], "answer": "suggest asking, threaten to report, offer to do", "explanation": "suggest → Ving（suggest asking）；threaten → to V（threaten to report）；offer → to V（offer to do）。三個動詞是Situation 4的核心，必須記住各自的接法。"}, {"id": "l001", "type": "listening", "title": "S6.6 — Radio Call-in: Just Tell Me I'm Wrong", "script": "Host: And up next, it's time for Just Tell Me I'm Wrong. Today's topic: how young is too young? Our first caller is Ed.\nEd: My eight-year-old kept asking for a smartphone, and eventually we bought her one. Last week, I got a bill for over $200!\nHost: So basically you think she's too young for a phone?\nEd: Yeah, that's right.\nHost: Surely it's up to the parents to set guidelines. Right from the beginning.", "question": "According to the Host, what should parents do about children and smartphones?", "options": ["Ban children from using smartphones completely.", "Set guidelines and rules from the beginning.", "Let children decide for themselves.", "Buy cheaper smartphones for children."], "answer": "Set guidelines and rules from the beginning.", "explanation": "主持人明確說：'Surely it's up to the parents to set guidelines. Right from the beginning.'（父母有責任從一開始就設好使用規範。）其他選項均未在對話中提及。"}, {"id": "l002", "type": "listening", "title": "S6.6 — Radio Call-in: Just Tell Me I'm Wrong", "script": "Julia: My question is about social networking sites. I don't let my daughter use them. She's only ten, and I'm worried about online bullying.\nHost: That's a very good point. Online bullying is a serious problem, but isn't it better to talk it over with her? She has to learn some time.\nJulia: So, what you mean is I'm being overprotective?\nHost: To be honest, yes.", "question": "Why does Julia not allow her daughter to use social networking sites?", "options": ["She thinks her daughter is too young at age ten.", "She is worried about online bullying.", "She cannot afford the internet.", "Her daughter has no interest in social media."], "answer": "She is worried about online bullying.", "explanation": "Julia明確說：'I'm worried about online bullying.'（我擔心網路霸凌。）雖然女兒只有10歲，但她給出的具體理由是擔心網路霸凌，這才是直接原因。"}, {"id": "l003", "type": "listening", "title": "S6.6 — Radio Call-in: Just Tell Me I'm Wrong", "script": "Dan: My son Seth, he's twelve. He spends all his time on the computer now.\nHost: Surely that's just normal nowadays. Don't you think it's just a stage he's going through? He'll grow out of it. You can't force him to go and play football if he doesn't want to.", "question": "What is the Host's opinion about Dan's son spending all his time on the computer?", "options": ["It is a serious problem that needs immediate action.", "It is probably just a normal phase he will grow out of.", "Dan should force his son to play football instead.", "Dan should take the computer away from his son."], "answer": "It is probably just a normal phase he will grow out of.", "explanation": "主持人說：'Don't you think it's just a stage he's going through? He'll grow out of it.'（這不過是個他正在經歷的階段，他會度過的。）主持人認為這是正常現象，不需要強制干預。"}, {"id": "l004", "type": "listening", "title": "S6.6 — Radio Call-in: Just Tell Me I'm Wrong", "script": "Zara: I was wondering how you would deal with a thirteen-year-old wanting to get pierced ears?\nHost: Thirteen years old? Doesn't she simply want to be like her friends?\nZara: Well, I'm not talking about a she.\nHost: Oh, in other words you're upset because your thirteen-year-old son wants to get his ears pierced.", "question": "What is surprising about Zara's situation?", "options": ["Her daughter is only thirteen years old.", "Her son, not her daughter, wants to get his ears pierced.", "Her child wants a tattoo, not just pierced ears.", "Her child wants multiple piercings."], "answer": "Her son, not her daughter, wants to get his ears pierced.", "explanation": "主持人一開始假設是女兒（she），但Zara說 'I'm not talking about a she'（我說的不是她），然後主持人才明白是13歲的兒子（son）想穿耳洞，這是令人意外的轉折。"}, {"id": "l005", "type": "listening", "title": "S6.6 — Radio Call-in: Just Tell Me I'm Wrong", "script": "Julia: I don't let my daughter use them. She's only ten, and I'm worried about online bullying.\nHost: That's a very good point. Online bullying is a serious problem, but isn't it better to talk it over with her?\nJulia: So, what you mean is I'm being overprotective?\nHost: To be honest, yes.", "question": "What does the Host suggest Julia should do instead of banning social media?", "options": ["Install parental control software.", "Talk it over with her daughter.", "Wait until her daughter is older.", "Report online bullying to the police."], "answer": "Talk it over with her daughter.", "explanation": "主持人問：'isn't it better to talk it over with her?'（跟她好好談談不是更好嗎？）意思是應該與女兒討論，而不是直接禁止。talk it over = 商量、討論清楚。"}, {"id": "l006", "type": "listening", "title": "S6.6 — Radio Call-in: Just Tell Me I'm Wrong", "script": "Ed: My eight-year-old kept asking for a smartphone, and eventually we bought her one. Last week, I got a bill for over $200!", "question": "What was Ed's main problem with buying his daughter a smartphone?", "options": ["His daughter lost the smartphone at school.", "He received a phone bill for over $200.", "His daughter was being bullied online.", "His daughter spent too much time on social media."], "answer": "He received a phone bill for over $200.", "explanation": "Ed說：'Last week, I got a bill for over $200!'（上週我收到了超過200美元的帳單！）說明女兒使用智慧型手機產生了高額費用，這是他主要的抱怨。"}, {"id": "l007", "type": "listening", "title": "S7.2 — Insight: Hoax Picture Interview", "script": "Hoaxer: Two reasons. One is mystery — a good hoax picture is more powerful if people don't know where it came from. The other reason is that hoaxers often use photographs taken by someone else without permission, and the original photographer could sue us.", "question": "Why does the Hoaxer want to remain anonymous? (Choose the BEST answer)", "options": ["Only because he wants to create a sense of mystery.", "Only because he is afraid of being arrested.", "Because of mystery, and because photographers could sue him.", "Because the police are investigating him."], "answer": "Because of mystery, and because photographers could sue him.", "explanation": "Hoaxer給出兩個理由：1) mystery（神秘感，好的惡作劇圖不知來源更有力）；2) 惡作劇者常未經許可使用他人照片，original photographer could sue us（原攝影師可能控告我們）。兩個原因都必須掌握。"}, {"id": "l008", "type": "listening", "title": "S7.2 — Insight: Hoax Picture Interview", "script": "Hoaxer: This picture of a bike in a tree looks like a hoax simply because it's such an unusual image. Also, it looks a little like a composite picture.\nInterviewer: What's a composite picture?\nHoaxer: When you combine two or more pictures, that's a composite. This would be a very easy hoax picture to put together.", "question": "What is a composite picture?", "options": ["A picture that is very difficult to create.", "A picture that combines two or more images.", "A picture taken with a special camera.", "A picture that has been printed in a newspaper."], "answer": "A picture that combines two or more images.", "explanation": "Hoaxer解釋：'When you combine two or more pictures, that's a composite.'（把兩張或以上的圖片合成，就是composite（合成圖）。）這是課文中composite picture的明確定義。"}, {"id": "l009", "type": "listening", "title": "S7.2 — Insight: Hoax Picture Interview", "script": "Hoaxer: I'm ninety-nine percent sure the shark picture is a hoax simply because it's a cliché — yet another picture of sharks swimming where they shouldn't be. The water next to the fins isn't right. The surface of the water would break differently if there really were sharks there.", "question": "How does the Hoaxer know the shark picture is likely a hoax?", "options": ["The sharks look too small in the picture.", "The picture quality is too low.", "It is a cliché and the water near the fins looks wrong.", "The color of the sharks is not realistic."], "answer": "It is a cliché and the water near the fins looks wrong.", "explanation": "Hoaxer給出兩個理由：1) it's a cliché（這種鯊魚不該出現的地方游泳的圖已是陳腔濫調）；2) The water next to the fins isn't right（鰭旁邊的水面不對）。兩點都要掌握。"}, {"id": "l010", "type": "listening", "title": "S7.2 — Insight: Hoax Picture Interview", "script": "Hoaxer: To be honest, I'm thrilled when people believe one of my pictures. Maybe we all like to believe something really unusual could be true.", "question": "Why does the Hoaxer make hoax pictures?", "options": ["To earn money from selling the pictures.", "To embarrass politicians.", "Because he is thrilled when people believe them.", "To help the police investigate crimes."], "answer": "Because he is thrilled when people believe them.", "explanation": "Hoaxer說：'I'm thrilled when people believe one of my pictures.'（當人們相信我的照片時，我感到非常興奮。）他補充 maybe we all like to believe something unusual could be true（也許我們都想相信不尋常的事是真的）。"}, {"id": "l011", "type": "listening", "title": "S7.4 — News Stories: Tiger Story", "script": "A: It's this story. 'A woman used a wooden soup ladle to save her husband from attack by a tiger.'\nB: What? A ladle?\nA: In Malaysia. Apparently, her husband had just gone into the forest. She saw the tiger attack him and grabbed the first thing she could find — a wooden soup ladle. And she just charged at the animal yelling at the top of her voice and bashing its head.\nB: And it didn't attack her?\nA: No, the tiger ran off.", "question": "What did the woman use to save her husband from the tiger?", "options": ["A wooden stick", "A wooden soup ladle", "A rifle", "A kitchen knife"], "answer": "A wooden soup ladle", "explanation": "故事明確說：'A woman used a wooden soup ladle to save her husband from attack by a tiger.'（一名女子用木製湯匙將丈夫從老虎的攻擊中救出。）ladle = 長柄湯匙。"}, {"id": "l012", "type": "listening", "title": "S7.4 — News Stories: Tiger Story", "script": "B: And it didn't attack her?\nA: No, the tiger ran off.\nB: That's the most extraordinary thing. What surprises me most is that the tiger just ran away and didn't attack the woman.", "question": "What surprised B the most about the tiger story?", "options": ["That the woman used a ladle as a weapon.", "That the incident happened in Malaysia.", "That the tiger ran away and did not attack the woman.", "That the woman was able to find a weapon so quickly."], "answer": "That the tiger ran away and did not attack the woman.", "explanation": "B說：'What surprises me most is that the tiger just ran away and didn't attack the woman.'（最令我驚訝的是老虎就這樣逃走了，沒有攻擊那位女子。）這也是課文提到「各故事最令女性驚訝」第①點。"}, {"id": "l013", "type": "listening", "title": "S7.4 — News Stories: Tiger Story", "script": "A: She saw the tiger attack him and grabbed the first thing she could find — a wooden soup ladle. And she just charged at the animal yelling at the top of her voice and bashing its head.", "question": "How did the woman react when she saw the tiger attacking her husband?", "options": ["She called the police immediately.", "She ran away to get help.", "She charged at the tiger, yelling and hitting its head.", "She threw the ladle at the tiger from a distance."], "answer": "She charged at the tiger, yelling and hitting its head.", "explanation": "故事說：'she just charged at the animal yelling at the top of her voice and bashing its head.'（她直接衝向那隻動物，扯開嗓子大叫，並猛打牠的頭。）charged at = 衝向，yelling = 大叫，bashing = 猛擊。"}, {"id": "l014", "type": "listening", "title": "S8.2 — Ultimatum Game", "script": "Man: I'm going to give you, Dominic, $10. You have to decide how much you're going to offer Heather. If Heather accepts, you divide the money as agreed. If Heather rejects your offer, neither of you gets anything.\nDominic: OK, I'm going to offer you $5.\nHeather: All right, I'll accept that.", "question": "In the Ultimatum Game, what happens if Heather rejects Dominic's offer?", "options": ["Dominic keeps all the money.", "Heather gets nothing but Dominic keeps his share.", "Neither of them gets any money.", "They have to negotiate again."], "answer": "Neither of them gets any money.", "explanation": "規則說明：'If Heather rejects your offer, neither of you gets anything.'（如果Heather拒絕，你們兩個都得不到任何錢。）這是Ultimatum Game的關鍵規則，使拒絕不公平提案有意義。"}, {"id": "l015", "type": "listening", "title": "S8.2 — Ultimatum Game", "script": "Man: Why did you decide on that split?\nDominic: Um, I guess, if I offered any less, I didn't think she'd take it.", "question": "Why did Dominic offer Heather $5 (half the money)?", "options": ["Because he wanted to be generous.", "Because he thought she would reject a lower offer.", "Because the rules required an equal split.", "Because Heather asked for exactly $5."], "answer": "Because he thought she would reject a lower offer.", "explanation": "Dominic解釋：'if I offered any less, I didn't think she'd take it.'（如果我出的更少，我不認為她會接受。）這說明他的決定是出於策略考量，而非純粹慷慨。"}, {"id": "l016", "type": "listening", "title": "S8.2 — Ultimatum Game", "script": "Man: What would have been the lowest amount you would have accepted?\nHeather: It actually would have been $5 because I think any lower than that I'd have felt sort of short-changed.", "question": "What was the LOWEST amount Heather said she would have accepted?", "options": ["$1", "$3", "$5", "$4"], "answer": "$5", "explanation": "Heather說：'It actually would have been $5 because I think any lower than that I'd have felt sort of short-changed.'（最低是$5，低於這個我會覺得吃虧。）她願意接受的最低金額是$5。"}, {"id": "l017", "type": "listening", "title": "S8.2 — Ultimatum Game", "script": "Heather: Because I felt it was equal, an equal split. It was very kind and generous to give me half.", "question": "Why did Heather accept Dominic's offer of $5?", "options": ["Because she had no other choice.", "Because she felt it was a fair and equal split.", "Because $5 is enough for her daily needs.", "Because Dominic pressured her to accept."], "answer": "Because she felt it was a fair and equal split.", "explanation": "Heather說：'Because I felt it was equal, an equal split. It was very kind and generous to give me half.'（因為我覺得這很公平，是平等分配。給我一半非常仁慈和慷慨。）她強調的是公平感（fairness）。"}, {"id": "l018", "type": "listening", "title": "S8.2 — Ultimatum Game", "script": "Man: I'm going to give you, Dominic, $10. You have to decide how much you're going to offer Heather. If Heather accepts, you divide the money as agreed. If Heather rejects your offer, neither of you gets anything.", "question": "In the Ultimatum Game, who has the power to decide how to split the money?", "options": ["Heather decides how much she wants.", "The Man decides for both players.", "Dominic decides how much to offer Heather.", "Both players negotiate together."], "answer": "Dominic decides how much to offer Heather.", "explanation": "規則說：'I'm going to give you, Dominic, $10. You have to decide how much you're going to offer Heather.'（Dominic決定要給Heather多少。）Dominic擁有決策權，但Heather有接受或拒絕的權利。"}, {"id": "l019", "type": "listening", "title": "S8.3 — Dictator Game", "script": "Man: This time it's called the Dictator Game. Dominic has the power. It's your decision. Heather has to accept it.\nDominic: The offer I'm going to give you this time is $1, and that means $9 will be for me.\nHeather: Well then I accept that 'cause I have no choice.", "question": "What is the key difference between the Dictator Game and the Ultimatum Game?", "options": ["In the Dictator Game, there is more money to split.", "In the Dictator Game, Heather has no power to reject the offer.", "In the Dictator Game, Dominic gets less money.", "In the Dictator Game, both players decide together."], "answer": "In the Dictator Game, Heather has no power to reject the offer.", "explanation": "主持人說：'Dominic has the power. It's your decision. Heather has to accept it.'（Heather必須接受。）Heather也說 'I have no choice'（我沒有選擇）。這是和Ultimatum Game最大的差異。"}, {"id": "l020", "type": "listening", "title": "S8.3 — Dictator Game", "script": "Man: How do you feel about that?\nHeather: I feel a bit short-changed, to be honest. I feel a bit cheated. His fairness from last time has all disappeared.", "question": "How does Heather feel about receiving only $1 in the Dictator Game?", "options": ["She feels satisfied because she got something.", "She feels short-changed and cheated.", "She feels grateful for Dominic's decision.", "She feels the same as in the Ultimatum Game."], "answer": "She feels short-changed and cheated.", "explanation": "Heather說：'I feel a bit short-changed, to be honest. I feel a bit cheated.'（老實說，我覺得有點吃虧，有點被欺騙。）她也說 'His fairness from last time has all disappeared.'（他上次的公平感完全消失了。）"}, {"id": "l021", "type": "listening", "title": "S8.3 — Dictator Game", "script": "Dominic: Um, I guess I gave you a dollar to still show that I'm not heartless. Um, it sort of, it was easier for me to say I won't feel so guilty.", "question": "Why did Dominic give Heather $1 instead of keeping everything?", "options": ["Because the rules required a minimum of $1.", "Because he wanted to show he is not completely heartless.", "Because Heather asked for at least $1.", "Because he thought $1 was a fair amount."], "answer": "Because he wanted to show he is not completely heartless.", "explanation": "Dominic說：'I gave you a dollar to still show that I'm not heartless.'（我給你一美元是為了表明我不是無情的人。）他還說這讓他感到少一點罪惡感（won't feel so guilty）。heartless = 無情的。"}, {"id": "l022", "type": "listening", "title": "S8.3 — Dictator Game", "script": "Dominic: The offer I'm going to give you this time is $1, and that means $9 will be for me.\nHeather: Well then I accept that 'cause I have no choice.\nHeather: I feel a bit short-changed, to be honest. I feel a bit cheated. His fairness from last time has all disappeared.", "question": "How much money did Dominic keep for himself in the Dictator Game?", "options": ["$5", "$7", "$9", "$8"], "answer": "$9", "explanation": "Dominic說：'The offer I'm going to give you this time is $1, and that means $9 will be for me.'（這次我給你$1，也就是說$9歸我。）和Ultimatum Game的公平分配$5/$5形成強烈對比。"}];

// ─── State ───────────────────────────────────────────
let allQ = QUESTIONS;
let sessionQ = [];
let idx = 0;
let correct = 0;
let wrong = 0;
let answered = false;
let selectedTypes = ['all'];
let sessionType = 'all';
let ttsUtter = null;
let ttsPlaying = false;

// Persistent stats
let stats = JSON.parse(localStorage.getItem('quizStats') || '{"done":0,"correct":0}');

function saveStats(){localStorage.setItem('quizStats', JSON.stringify(stats));}

// ─── Home ─────────────────────────────────────────────
function updateHome(){
  document.getElementById('done-count').textContent = stats.done;
  if(stats.done > 0){
    document.getElementById('acc-pct').textContent = Math.round(stats.correct/stats.done*100)+'%';
  }
  // update counts
  const types = ['vocab','grammar','matching','situation','listening'];
  types.forEach(t=>{
    document.getElementById('count-'+t).textContent = allQ.filter(q=>q.type===t).length+'題';
  });
  document.getElementById('count-all').textContent = allQ.length+'題';
  document.getElementById('total-count').textContent = allQ.length;
}

function toggleType(el){
  const t = el.dataset.type;
  if(t === 'all'){
    document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));
    el.classList.add('active');
    selectedTypes = ['all'];
  } else {
    const allBtn = document.querySelector('.type-btn[data-type="all"]');
    allBtn.classList.remove('active');
    el.classList.toggle('active');
    selectedTypes = [...document.querySelectorAll('.type-btn.active')].map(b=>b.dataset.type);
    if(selectedTypes.length === 0){
      allBtn.classList.add('active');
      selectedTypes = ['all'];
    }
  }
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function startQuiz(){
  let pool = allQ;
  if(!selectedTypes.includes('all')){
    pool = allQ.filter(q=>selectedTypes.includes(q.type));
  }
  sessionQ = shuffle(pool);
  sessionType = selectedTypes.join(',');
  idx = 0; correct = 0; wrong = 0;
  document.getElementById('home').style.display='none';
  document.getElementById('result').style.display='none';
  document.getElementById('quiz').style.display='block';
  renderQuestion();
}

function goHome(){
  stopTTS();
  document.getElementById('quiz').style.display='none';
  document.getElementById('result').style.display='none';
  document.getElementById('home').style.display='flex';
  updateHome();
}

function restartSame(){
  document.getElementById('result').style.display='none';
  startQuiz();
}

// ─── TTS ──────────────────────────────────────────────
function stopTTS(){
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  ttsPlaying = false;
  const btn = document.getElementById('tts-btn');
  if(btn){ btn.textContent='▶ 朗讀對話'; btn.classList.remove('playing');}
}

function toggleTTS(){
  const q = sessionQ[idx];
  if(!q || !q.script) return;
  if(ttsPlaying){ stopTTS(); return; }
  stopTTS();
  ttsUtter = new SpeechSynthesisUtterance(q.script.replace(/\n/g,' '));
  ttsUtter.lang = 'en-US';
  ttsUtter.rate = 0.9;
  ttsUtter.onend = ()=>{
    ttsPlaying=false;
    const btn=document.getElementById('tts-btn');
    if(btn){btn.textContent='▶ 朗讀對話';btn.classList.remove('playing');}
  };
  window.speechSynthesis.speak(ttsUtter);
  ttsPlaying=true;
  const btn=document.getElementById('tts-btn');
  btn.textContent='■ 停止';btn.classList.add('playing');
}

// ─── Render ───────────────────────────────────────────
const TYPE_LABELS = {vocab:'單字',grammar:'文法',matching:'配對',situation:'情境',listening:'聽力'};
const KEYS = ['A','B','C','D'];

function renderQuestion(){
  stopTTS();
  answered = false;
  const q = sessionQ[idx];
  if(!q){ showResult(); return; }

  // progress
  const pct = (idx/sessionQ.length*100).toFixed(1);
  document.getElementById('prog-bar').style.width = pct+'%';
  document.getElementById('prog-label').textContent = (idx+1)+'/'+sessionQ.length;
  document.getElementById('sc-correct').textContent = correct;
  document.getElementById('sc-wrong').textContent = wrong;

  // badge
  const badge = document.getElementById('q-type-badge');
  badge.textContent = TYPE_LABELS[q.type] || q.type;
  badge.className = 'q-type '+q.type;
  document.getElementById('q-id-label').textContent = q.id;

  // listening
  const scriptArea = document.getElementById('script-area');
  if(q.type === 'listening' && q.script){
    scriptArea.style.display='block';
    document.getElementById('tts-btn').textContent='▶ 朗讀對話';
    document.getElementById('tts-btn').classList.remove('playing');
    // format script: bold speaker names
    const formatted = q.script.replace(/^([A-Z][a-z]*:)/gm,'<strong>$1</strong>');
    document.getElementById('script-box').innerHTML = formatted;
    if(q.title){
      document.getElementById('script-box').innerHTML = '<strong style="font-size:.65rem;color:var(--gold);letter-spacing:.1em">'+q.title+'</strong>\n\n' + formatted;
    }
  } else {
    scriptArea.style.display='none';
  }

  // question
  document.getElementById('q-text').textContent = q.question;

  // options - shuffle for variety
  const shuffledOpts = shuffle(q.options);
  const optsEl = document.getElementById('opts');
  optsEl.innerHTML = '';
  shuffledOpts.forEach((opt,i)=>{
    const btn = document.createElement('button');
    btn.className='opt';
    btn.innerHTML=`<span class="opt-key">${KEYS[i]}</span><span>${opt}</span>`;
    btn.onclick=()=>selectAnswer(opt, shuffledOpts, btn);
    optsEl.appendChild(btn);
  });

  document.getElementById('expl-area').style.display='none';
  document.getElementById('expl-area').innerHTML='';
  document.getElementById('next-btn').style.display='none';
}

function selectAnswer(chosen, opts, clickedBtn){
  if(answered) return;
  answered = true;
  const q = sessionQ[idx];
  const isCorrect = chosen === q.answer;

  // highlight all options
  document.querySelectorAll('.opt').forEach((btn,i)=>{
    btn.disabled=true;
    const optText = btn.querySelector('span:last-child').textContent;
    if(optText === q.answer){ btn.classList.add('correct'); btn.querySelector('.opt-key').textContent='✓';}
    else if(btn === clickedBtn && !isCorrect){ btn.classList.add('wrong'); btn.querySelector('.opt-key').textContent='✗';}
  });

  // explanation
  const explArea = document.getElementById('expl-area');
  explArea.innerHTML = `
    <div class="expl-box">
      <div class="expl-head ${isCorrect?'correct':'wrong'}">${isCorrect?'✓ 正確':'✗ 答錯了'} — 解析</div>
      ${q.explanation}
    </div>`;
  explArea.style.display='block';

  document.getElementById('next-btn').style.display='block';

  // stats
  stats.done++;
  if(isCorrect){ correct++; stats.correct++; }
  else { wrong++; }
  saveStats();
  document.getElementById('sc-correct').textContent = correct;
  document.getElementById('sc-wrong').textContent = wrong;
}

function nextQuestion(){
  idx++;
  if(idx >= sessionQ.length){ showResult(); return; }
  renderQuestion();
}

// ─── Result ───────────────────────────────────────────
function showResult(){
  stopTTS();
  document.getElementById('quiz').style.display='none';
  const acc = sessionQ.length>0?Math.round(correct/sessionQ.length*100):0;
  let title = '加油！';
  if(acc>=90) title='太強了！🔥';
  else if(acc>=70) title='不錯！繼續！';
  else if(acc>=50) title='有進步空間';
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-score').innerHTML = correct+'<span class="denom">/'+sessionQ.length+'</span>';
  document.getElementById('rb-correct').textContent = correct;
  document.getElementById('rb-wrong').textContent = wrong;
  document.getElementById('rb-acc').textContent = acc+'%';
  document.getElementById('result').style.display='flex';
}

// ─── Init ─────────────────────────────────────────────
updateHome();
document.getElementById('result').style.display='none';
document.getElementById('quiz').style.display='none';
document.getElementById('home').style.display='flex';
</script>
