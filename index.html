<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>簡報庫</title>
<style>
:root{--bg:#ececec;--fg:#111113;--mute:#6c6c73;--faint:#a5a5ab;--line:rgba(0,0,0,.09);--panel:rgba(0,0,0,.05);--ring:rgba(0,0,0,.1);--bar:rgba(246,246,246,.78);--glow:rgba(255,255,255,.6);--btn:#111113;--on-btn:#fff;--shadow:0 24px 50px -24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"SF Pro Text","PingFang TC","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:520px;background:radial-gradient(60% 100% at 50% 0,var(--glow),transparent 70%);pointer-events:none;z-index:0}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.wrap{max-width:1320px;margin:0 auto;padding:0 28px}

/* 頂列 */
header{position:sticky;top:0;z-index:10;background:var(--bar);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:20px;height:60px}
/* 頂列一律用符號，文字放在 title（滑鼠停留）和 aria-label */
header svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;text-decoration:none;color:inherit}
.brand svg{width:30px;height:30px;stroke-width:1.3}
.tabs{display:flex;padding:3px;background:var(--panel);border-radius:999px}
.tabs button{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--mute);font:inherit;font-size:13px;padding:6px 13px;border-radius:999px;cursor:pointer;transition:color .2s,background .2s}
.tabs button:hover{color:var(--fg)}
.tabs button.on{background:var(--btn);color:var(--on-btn)}
/* 觸控沒有滑鼠停留可以看 title：選中的那一顆直接把名稱寫出來，按鈕也放大到好按的尺寸 */
.tl,.tabs button[hidden]{display:none}
.touch .tabs button{padding:10px 15px}
.touch .tabs button.on .tl{display:inline}
.touch .search{height:42px}
.touch .search svg{margin:0 13px}
.touch header:has(.search:focus-within) :is(.tl,#total),.touch header:has(.search input:not(:placeholder-shown)) :is(.tl,#total){display:none}
/* 搜尋平常只有放大鏡，點了（或有輸入內容時）才展開 */
.search{display:flex;align-items:center;height:34px;border-radius:999px;background:var(--panel);color:var(--mute);cursor:text;transition:color .2s}
.search:hover,.search:focus-within{color:var(--fg)}
.search svg{margin:0 9px;flex:none}
.search input{width:0;padding:0;border:0;background:none;color:var(--fg);font:inherit;font-size:13px;outline:0;transition:width .25s,padding .25s}
.search:focus-within input,.search input:not(:placeholder-shown){width:180px;padding-right:14px}

main{position:relative;z-index:1}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:500;text-decoration:none;background:var(--btn);color:var(--on-btn);transition:transform .2s,opacity .2s}
.btn:hover{transform:translateY(-1px);opacity:.9}
.btn.ghost{background:none;color:var(--fg);box-shadow:inset 0 0 0 1px var(--ring)}
.btn.ghost:hover{background:var(--panel)}

/* 圓環：卡片沿半徑方向立著排成一圈 */
.orbit{display:grid;place-items:center;perspective:1400px;user-select:none;-webkit-user-select:none}
.ring{position:relative;width:0;height:0;transform-style:preserve-3d;transform:rotateX(-20deg) rotateY(var(--rot,0deg))}
.c{position:absolute;left:calc(var(--w)/-2);top:calc(var(--w)*-.28125);width:var(--w);aspect-ratio:16/9;border-radius:calc(var(--w)*.04);overflow:hidden;background:#111;box-shadow:0 0 0 1px var(--ring);transform:rotateY(var(--a)) translateZ(var(--r)) rotateY(90deg) translateY(var(--lift,0px));transition:opacity .35s,transform .35s cubic-bezier(.2,.7,.2,1)}
.c{box-sizing:border-box;padding:calc(var(--w)*.022);background:linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,255,255,.4));box-shadow:0 0 0 1px rgba(255,255,255,.75),inset 0 1px 1px rgba(255,255,255,.95),inset 0 -1px 2px rgba(0,0,0,.08),0 10px 28px -14px rgba(0,0,0,.4)}
.c::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.5),rgba(255,255,255,.1) 30%,transparent 48%,transparent 72%,rgba(255,255,255,.28))}
.c img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;border-radius:calc(var(--w)*.026);filter:brightness(1.12) saturate(1.08);-webkit-user-drag:none;pointer-events:none}
.c img.contain{object-fit:contain;object-position:center}
@keyframes spin{from{transform:rotateX(-20deg) rotateY(0)}to{transform:rotateX(-20deg) rotateY(360deg)}}

/* 地圖：群組直排，一條軸線從每個圓環中心穿過 */
.map{position:relative;display:flex;flex-direction:column;align-items:center;padding:56px 0 96px;animation:fade .5s both}
@keyframes fade{from{opacity:0}}
.hub{display:flex;flex-direction:column;align-items:center;gap:2px;padding-bottom:18px}
.hub .mono{font-size:15px;color:var(--fg)}
.hub::after,.end{content:"";width:7px;height:7px;border-radius:50%;background:var(--fg)}
.hub::after{margin-top:16px}
.node{position:relative;display:block;text-decoration:none;color:inherit;outline:0}
.node .orbit{--r:124px;--w:68px;width:380px;max-width:100vw;height:264px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
/* 軸線放在圓環的 3D 空間裡：前半圈的卡片擋住它，後半圈被它擋住 */
.axis{position:absolute;left:50%;top:0;bottom:0;width:1px;margin-left:-.5px;background:var(--mute)}
.node .ring{animation:spin 60s linear infinite}
.node:nth-of-type(even) .ring{animation-direction:reverse}
.node:hover .orbit,.node:focus-visible .orbit{transform:scale(1.07)}
/* 觸控：滑到畫面中段的那一組代替滑鼠停留，按下去會縮一下 */
.touch .node:hover .orbit{transform:none}
.touch .node.near .orbit{transform:scale(1.07)}
.touch .node:active .orbit{transform:scale(.96)}
.touch .latest:active,.touch .card .main:active{opacity:.7}
.lab{position:absolute;top:50%;left:calc(50% + 215px);transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;white-space:nowrap}
.node:nth-of-type(even) .lab{left:auto;right:calc(50% + 215px);text-align:right}
.lab b{font-size:20px;font-weight:650}
.node:focus-visible .lab b{text-decoration:underline}

/* 群組 */
.focus{position:relative;height:calc(100vh - 61px);min-height:620px;display:flex;flex-direction:column;animation:fade .5s both;overflow:hidden}
.focus .orbit{--r:clamp(140px,min(30vw,34vh),360px);--w:calc(var(--r)*.52);flex:1;min-height:0;cursor:grab;touch-action:pan-y}
.focus .orbit.drag{cursor:grabbing}
.focus .c{cursor:pointer}
/* 墊底的卡片淡化，這個群組自己的作品浮起來一點當標記 */
.c.other{opacity:.3}
.c.other img{filter:grayscale(1) brightness(1.1)}
.c.blank{opacity:.35}
.c.own{--lift:calc(var(--w)*-.07)}
.ring.has-hot .c{opacity:.22}
.ring.has-hot .c.other,.ring.has-hot .c.blank{opacity:.14}
.ring.has-hot .c.hot{opacity:1;--lift:calc(var(--w)*-.1)}
.side{position:absolute;left:28px;top:28px;bottom:28px;width:min(260px,42vw);z-index:2;display:flex;flex-direction:column;gap:22px;overflow:auto;scrollbar-width:none}
.side::-webkit-scrollbar{display:none}
.info{pointer-events:none}
.side h3{margin:0 0 8px;font-size:11px;font-weight:500;color:var(--faint);letter-spacing:.08em}
.side .chips{flex-direction:column;flex-wrap:nowrap;justify-content:flex-start;gap:2px;padding:0}
.side .chip,.side .chip.hot,.side .chip:focus-visible{box-shadow:none;background:none;color:var(--fg);padding:5px 0;border-radius:0}
.side .chip{color:var(--mute)}
.side .chip.hot,.side .chip:focus-visible{color:var(--fg)}
.side .chip.hot b{text-decoration:underline;text-underline-offset:4px}
.glist{display:flex;flex-wrap:wrap;gap:4px 16px;margin-bottom:-8px}
.glist a{color:var(--mute);text-decoration:none;font-size:13px;transition:color .2s}
.glist a:hover{color:var(--fg)}
.glist .cur,.glist .unc:not(.cur){display:none}
/* 觸控：點卡片或標題是「選起來看預覽」，這顆才是開啟 */
.go{margin-top:14px;padding:9px 18px;pointer-events:auto;white-space:nowrap}
.go[hidden],html:not(.touch) .go{display:none}
/* 觸控：圓環當成滾輪，上下滑一格換一件 */
.touch .focus .orbit{touch-action:none}
.swipe,.gh,.side .chip:not(.own){display:none}   /* 側欄只列目前這組；群組標題只有手機的滾輪用 */
.touch .swipe{display:block;flex:none;order:3;text-align:center;padding-bottom:12px;transition:opacity .5s}
.swiped .swipe{opacity:0}
/* 預覽圖只鎖高度：位置一直留著，寬度跟著圖片比例走，直式、橫式都完整顯示不裁切。標題固定兩行、說明固定一行，清單不會被推動 */
.info .pv{height:146px;margin-bottom:14px}
.info .pv img{height:100%;width:auto;max-width:100%;object-fit:contain;object-position:left top;display:block;border-radius:10px;box-shadow:0 0 0 1px var(--ring);opacity:0;transition:opacity .25s}
.info .pv.on img{opacity:1}
.info h2{margin:0 0 4px;font-size:20px;font-weight:650;line-height:1.3;height:2.6em;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.info .mono{display:block;height:17px;line-height:17px;overflow:hidden;text-overflow:ellipsis}   /* 沒有說明文字的作品也留著這一行，清單才不會往上跳 */
.back{position:absolute;right:28px;top:28px;z-index:2;padding:8px 16px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:0 28px 30px}
.chip{display:flex;align-items:baseline;gap:8px;max-width:100%;padding:7px 14px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--ring);text-decoration:none;color:var(--fg);font-size:13px;transition:background .2s,color .2s}
.chip b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.hot,.chip:focus-visible{background:var(--btn);color:var(--on-btn);outline:0}
.chip.hot .mono,.chip:focus-visible .mono{color:inherit;opacity:.6}

/* 最新加入 */
.latest{position:absolute;left:28px;top:28px;width:230px;display:flex;flex-direction:column;gap:3px;text-decoration:none;color:inherit;outline:0}
.latest .shot{--sh:130px;margin-bottom:11px;transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.latest:hover .shot,.latest:focus-visible .shot{transform:translateY(-3px)}
.latest b{font-size:15px;font-weight:600;line-height:1.4}

/* 編輯 */
.edit button{font:inherit;cursor:pointer;border:0}
.edit button:disabled{opacity:.5;cursor:default}
.edit input:not([type=file]){width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);font:inherit;font-size:14px;outline:0}
.edit input:focus{border-color:var(--mute)}
.edit input[type=file]{font:inherit;font-size:13px;color:var(--mute);max-width:100%}
/* 群組列：左到右排群組環，最左是新增 */
.gbar{position:sticky;top:61px;z-index:5;background:var(--bar);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--line)}
.gscroll{display:flex;gap:6px;overflow-x:auto;padding-top:12px;padding-bottom:12px}
.gt{flex:none;width:116px;padding:8px 6px 10px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;color:var(--fg);outline:1.5px dashed transparent;outline-offset:-2px;transition:background .2s,color .2s,opacity .2s,outline-color .2s}
.gt{cursor:pointer;user-select:none;-webkit-user-select:none}
.gt:hover{background:var(--panel)}
.gt:focus-visible{outline-color:var(--fg)}
.gt.lift{opacity:.3}
/* 拖群組排序：在會插入的那一側畫一條線 */
.gt.ins-l{box-shadow:inset 3px 0 0 var(--fg)}
.gt.ins-r{box-shadow:inset -3px 0 0 var(--fg)}
.gt.on{background:var(--panel);box-shadow:inset 0 0 0 1px var(--ring)}
.gt .orbit{--r:36px;--w:21px;width:100px;height:66px}
.gt>*{pointer-events:none}
.gt b{font-size:13px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.circ{width:50px;height:50px;margin:8px 0;border-radius:50%;display:grid;place-items:center;font-size:13px;color:var(--mute);border:1px dashed var(--faint)}
.gt.add .circ{font-size:24px;font-weight:300;color:var(--fg);border-style:solid;border-color:var(--ring)}
/* 拖曳中：其他群組亮出虛線框，可以丟過去 */
.edit.dragging .gt:not(.on){outline-color:var(--mute)}
.edit.dragging .gt.on{opacity:.3}
.edit.dragging .gt.over{background:var(--btn);color:var(--on-btn);outline-color:transparent}
.edit.dragging .gt.over .mono,.edit.dragging .gt.over .circ{color:inherit;border-color:currentColor}
.ebody{padding-top:32px;padding-bottom:96px}
.ehead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:26px}
.ehead h2{margin:0;font-size:22px;font-weight:650}
.ehead .gname{width:auto;flex:0 1 240px;font-size:20px;font-weight:650;padding:6px 12px}
.ehead .sp{flex:1}
.ehead .btn{padding:9px 18px}
.up{padding:22px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--ring);margin-bottom:32px;animation:rise .35s both}
.up form{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;align-items:end}
.up label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mute);min-width:0}
.up .full{grid-column:1/-1}
.up .go{grid-column:1/-1;display:flex;align-items:center;gap:14px}
/* 編輯頁的作品：一列一件（小圖｜標題｜封面頁｜刪除）。小圖放在固定寬的格子裡置中，直式橫式都不會撐出空白 */
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:0 36px;margin-bottom:56px}
.ecard{display:grid;grid-template-columns:auto 84px 1fr auto auto;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.ecard .shot{--sh:48px;justify-self:center;border-radius:6px;cursor:grab;transition:transform .25s,box-shadow .25s}
.ecard .shot img{pointer-events:none}
.ecard .shot:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--mute),var(--shadow)}
.ecard.ghost{opacity:.35}
/* 拖作品排序：在會插入的那一側畫一條線 */
.ecard.ins-t{box-shadow:inset 0 2px 0 var(--fg)}
.ecard.ins-b{box-shadow:inset 0 -2px 0 var(--fg)}
/* 封面頁欄位平常收起來，點一下圖示才出現 */
.cov{display:none;align-items:center;gap:6px;font-size:12px;color:var(--mute);white-space:nowrap}
.ecard.open .cov{display:flex}
.ecard.open .shot{box-shadow:0 0 0 2px var(--fg)}
.cov input{width:56px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);font:inherit;outline:0}
.ecard .x{grid-column:5;width:26px;height:26px;border-radius:50%;background:none;color:var(--mute);font-size:17px;line-height:1;transition:background .2s,color .2s}
.ecard .x:hover{background:#e5484d;color:#fff}
.del{background:none;color:var(--mute);padding:8px 10px;border-radius:8px;font-size:13px}
.del:hover{background:rgba(255,80,80,.14);color:#ff6b6b}
.none{color:var(--mute);padding:48px 0 72px;text-align:center}
.pub{display:flex;flex-wrap:wrap;align-items:center;gap:14px;border-top:1px solid var(--line);padding-top:24px}
.pub pre{flex-basis:100%;margin:0;font:12px/1.6 ui-monospace,Menlo,monospace;color:var(--mute);white-space:pre-wrap}
.err{color:#ff6b6b}
/* 確認／輸入視窗（不用瀏覽器內建的 confirm、prompt，有些環境會被擋掉） */
.dlg{width:min(380px,calc(100vw - 32px));padding:24px;border:0;border-radius:16px;background:var(--bg);color:var(--fg);box-shadow:0 0 0 1px var(--ring),var(--shadow)}
.dlg::backdrop{background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}
.dlg p{margin:0 0 18px;font-size:15px;line-height:1.6;white-space:pre-line}
.dlg input{width:100%;margin-bottom:18px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);font:inherit;outline:0}
.dlg input:focus{border-color:var(--mute)}
.dlg .go{display:flex;justify-content:flex-end;gap:10px}
.dlg button{font:inherit;font-size:14px;cursor:pointer;border:0;padding:9px 18px}
.btn.danger{background:#e5484d;color:#fff}

/* 列表 */
.listv{padding-bottom:96px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:48px;align-items:center;padding:56px 0 64px}
.hero .shot{--sh:clamp(220px,32vw,400px);border-radius:18px;box-shadow:var(--shadow)}
.hero h2{margin:14px 0 12px;font-size:clamp(28px,3.2vw,44px);line-height:1.18;font-weight:650;letter-spacing:-.01em;text-wrap:balance}
.hero .acts{display:flex;gap:10px;margin-top:28px}
.sec{display:flex;align-items:center;gap:14px;margin:0 0 22px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec b{font-weight:500;color:var(--fg)}
/* 列表：同一列等高，卡片寬度＝圖片寬度，直式的圖不會佔掉一整欄 */
.grid{display:flex;flex-wrap:wrap;gap:36px 24px;margin-bottom:72px;--sh:220px}
.card{flex:none;width:fit-content;min-width:150px;max-width:100%}
.card .meta,.card .desc{contain:inline-size}
.card{position:relative;animation:rise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.card>a.main{display:block;text-decoration:none;color:inherit;outline:0}
/* 縮圖共用規則：只鎖高度（--sh），寬度跟圖片比例走，整張顯示不裁切。
   img 的 min-width 是給還沒載入的圖一個寬度，否則寬 0 的 lazy 圖可能不會被載入 */
.shot{position:relative;display:block;height:var(--sh);width:fit-content;max-width:100%;border-radius:12px;overflow:hidden;background:#0b0b0c;box-shadow:0 0 0 1px var(--ring)}
.shot img{height:100%;width:auto;min-width:calc(var(--sh)*.4);max-width:100%;object-fit:contain;display:block;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.shot::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.55));opacity:0;transition:opacity .3s}
.card:hover .shot::after,.main:focus-visible .shot::after{opacity:1}
.card.site:hover .shot img{transform:scale(1.035)}
.main:focus-visible .shot{box-shadow:0 0 0 2px var(--fg)}
.tag{position:absolute;left:12px;bottom:11px;z-index:2;color:#fff;opacity:0;transform:translateY(4px);transition:opacity .3s,transform .3s}
.card:hover .tag,.main:focus-visible .tag{opacity:1;transform:none}
.segs{position:absolute;left:10px;right:10px;top:10px;z-index:2;display:flex;gap:3px;opacity:0;transition:opacity .25s}
.card:hover .segs,.card.live .segs{opacity:1}
.segs{filter:drop-shadow(0 0 1px rgba(0,0,0,.55))}
.card.deck .shot{touch-action:pan-y}
/* 觸控：頁數條移到縮圖下緣（右上角是下載鈕），墊一塊深色底，白底的投影片上也看得到 */
.touch .segs{top:auto;bottom:10px;padding:5px 6px;border-radius:7px;background:rgba(20,20,22,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.segs i{flex:1;height:2px;border-radius:2px;background:rgba(255,255,255,.3)}
.segs i.on{background:#fff}
.meta{display:flex;align-items:baseline;gap:12px;padding:14px 2px 0}
.title{flex:1;min-width:0;font-size:15px;font-weight:550;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.desc{padding:3px 2px 0;font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.desc.mono{font-size:11px;padding-top:5px}
.act{position:absolute;top:10px;right:10px;z-index:3;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(20,20,22,.6);color:#fff;text-decoration:none;font-size:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);opacity:0;transform:scale(.9);transition:opacity .25s,transform .25s,background .2s}
.card:hover .act,.act:focus-visible{opacity:1;transform:none}
.act:hover{background:#fff;color:#000}
.card.deck .act{top:22px}
@media (hover:none){.act{opacity:1;transform:none}.card.deck .act{top:10px}}
.empty{text-align:center;color:var(--mute);padding:120px 0}
.empty b{display:block;color:var(--fg);font-size:18px;font-weight:550;margin-bottom:6px}
footer{border-top:1px solid var(--line);padding:22px 0 40px;display:flex;justify-content:space-between}

@media (max-width:860px){
  .wrap{padding:0 16px}
  header .wrap{gap:10px}
  .search:focus-within input,.search input:not(:placeholder-shown){width:110px}
  .map{padding:24px 0 64px}
  .latest{position:static;display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-content:center;width:calc(100% - 32px);max-width:420px;margin-bottom:36px}
  .latest .shot{--sh:68px;margin:0;grid-row:span 2}
  .latest>span.mono{align-self:end}.latest b{align-self:start}
  .gbar{position:static}
  .gscroll{padding-top:10px;padding-bottom:10px}
  .ebody{padding-top:24px;padding-bottom:64px}
  .up form{grid-template-columns:1fr}
  .egrid{grid-template-columns:1fr}
  .ecard{grid-template-columns:auto 64px 1fr auto auto;gap:10px}
  .ecard .shot{--sh:40px}
  .focus{height:calc(100svh - 61px);min-height:520px}
  /* 群組頁改成由上到下：群組切換｜圓環｜作品標題（橫向捲）｜底部預覽列 */
  .side{display:contents}
  .glist{order:1;flex:none;flex-wrap:nowrap;gap:0 18px;margin:0 112px 0 0;padding:14px 16px 0;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
  .glist::-webkit-scrollbar,.side .chips::-webkit-scrollbar{display:none}
  .glist a{font-size:15px;padding:8px 0}
  .glist .cur{display:inline;color:var(--fg);font-weight:650}
  .glist a{transition:color .3s}
  .back{right:16px;top:16px}
  .focus .orbit{order:2;--r:clamp(110px,42vw,220px);padding-bottom:34vh}
  /* 作品標題放在右下角直排、靠右對齊；選中的那件被轉到圓環左前方，兩邊剛好錯開 */
  .side .chips{position:absolute;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:2;width:min(76vw,340px);max-height:252px;flex-direction:column;align-items:flex-end;gap:0;padding:0;overflow-y:auto;scrollbar-width:none}
  .side .chips .chip{flex:none;height:36px;align-items:center;max-width:100%;padding:0;font-size:14px}
  .side .chip.hot b{font-weight:600;text-decoration:none}
  /* 觸控：這一排是滾輪（.wheel 由 JS 掛上），只列目前這一組的作品，上面是群組名稱；滑過這一組的頭尾再多拉一點，上／下一組的名稱會跟著放大，放開就進到那一組。
     位置每一格畫面都跟著圓環的角度算（JS 直接寫 transform／opacity），選中的在中間那一格、離得越遠越淡越小 */
  .side .chips.wheel{height:252px;overflow:hidden;touch-action:none;-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 74%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 74%,transparent)}
  .side .chips.wheel .chip,.chips.wheel .gh{position:absolute;right:0;top:0;display:flex;align-items:center;height:36px;max-width:83%;transform-origin:100% 50%;will-change:transform,opacity;transition:color .25s}
  .chips.wheel .gh{gap:10px;white-space:nowrap}
  .chips.wheel .gh b{font-size:24px;font-weight:300;letter-spacing:.04em;color:color-mix(in srgb,var(--faint) calc(var(--o,0)*100%),#57575d)}   /* --o：往外拉時這一組的名稱跟著退成灰的 */
  .chips.wheel .gh .mono{color:var(--faint)}
  /* 標題靠右貼齊、字大而細；作品縮進去一格、右邊一條細線串起來，選中的那件在線上有一小段深色記號 */
  .side .chips.wheel .chip{padding-right:16px;font-size:14px;color:var(--mute)}
  .side .chips.wheel .chip b,.side .chips.wheel .chip.hot b{font-weight:400}
  .side .chips.wheel .chip.hot{color:#2c2c31}
  .chips.wheel .chip::after{content:"";position:absolute;right:0;top:0;bottom:0;width:1px;background:var(--faint);opacity:.7}
  .chips.wheel .chip.hot::after{right:-.5px;top:8px;bottom:8px;width:2px;border-radius:2px;background:#2c2c31;opacity:1}
  /* 上／下一組的名稱：平常小小細細、淡淡地放在這一組的頭尾外面，旁邊一個箭頭。往外拉：灰→黑、放大靠近，箭頭像打勾一樣由左到右描成橘色；拉滿整個變橘色彈一下，放開就進去 */
  .chips.wheel .chip .mono{display:none}
  .chips.wheel .gh b{display:inline-block;transform-origin:100% 50%;transition:transform .45s cubic-bezier(.3,2.2,.5,1)}
  .gh .ic{display:none;flex:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .45s cubic-bezier(.3,2.2,.5,1)}
  .gh.pull .ic{display:block}
  .gh.pull .mono{display:none}
  .gh.pull{--hot:#ff5a1f;transition:none}
  .chips.wheel .gh.pull b{color:color-mix(in srgb,#57575d calc(var(--t,0)*100%),var(--faint))}
  .gh.pull .ic{color:var(--faint)}
  .gh.prev .ic{transform:scaleY(-1)}
  .ic .tr{opacity:.9}
  .ic .pg{stroke:var(--hot);stroke-dasharray:1;stroke-dashoffset:calc(1 - var(--t,0));opacity:calc(var(--t,0)*20)}
  .chips.wheel .gh.armed b{color:var(--hot);transform:scale(1.08);font-weight:400;transition:transform .45s cubic-bezier(.3,2.2,.5,1),color .15s}
  .gh.armed .ic{transform:scale(1.3)}
  .gh.prev.armed .ic{transform:scale(1.3,-1.3)}
  .info{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:2;display:flex;align-items:center;justify-content:flex-end;gap:12px;max-width:calc(100% - 32px);text-align:right;pointer-events:auto}
  .info .pv{display:none}
  .info .tx{min-width:0}
  .info h2{font-size:16px;height:auto;-webkit-line-clamp:1;margin:0 0 2px}
  .touch .info h2{display:none}
  .go{margin:0}
  .touch .swipe{position:absolute;left:16px;bottom:calc(28px + env(safe-area-inset-bottom));padding:0}
  .hero{grid-template-columns:1fr;gap:22px;padding:28px 0 44px}
  .hero .shot{--sh:min(56vw,300px)}
  .grid{gap:28px 16px;margin-bottom:52px;--sh:168px}
}
/* 窄螢幕放不下左右兩側的群組標題：改放在圓環中間偏上、只留名稱；軸線在標題那一段斷開，不從字中間穿過 */
@media (max-width:640px){
  .node .orbit{--r:108px;--w:60px;height:236px}
  .lab,.node:nth-of-type(even) .lab{top:50%;left:50%;right:auto;transform:translate(-50%,calc(-100% + 8px));align-items:center;text-align:center}
  .lab b{font-size:17px}
  .lab .mono{display:none}
  .axis{background:linear-gradient(var(--mute) 0 calc(50% - 20px),transparent 0 calc(50% + 11px),var(--mute) 0)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="#" title="簡報庫" aria-label="簡報庫"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.0 13.0L22.6 13.7M16.4 14.6L19.8 16.7M13.6 15.6L14.8 18.4M10.4 15.6L9.2 18.4M7.6 14.6L4.2 16.7M6.0 13.0L1.4 13.7M6.0 11.0L1.4 10.3M7.6 9.4L4.2 7.3M10.4 8.4L9.2 5.6M13.6 8.4L14.8 5.6M16.4 9.4L19.8 7.3M18.0 11.0L22.6 10.3"/></svg><span class="mono" id="total"></span></a>
  <div class="tabs" id="tabs">
    <button data-mode="map" class="on" title="地圖" aria-label="地圖"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 4.2v1.6M8 10.2v1.6"/><circle cx="8" cy="2.6" r="1.6"/><circle cx="8" cy="8" r="2.2"/><circle cx="8" cy="13.4" r="1.6"/></svg><span class="tl">地圖</span></button>
    <button data-mode="list" title="列表" aria-label="列表"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg><span class="tl">列表</span></button>
    <button data-mode="edit" id="editbtn" hidden title="編輯" aria-label="編輯"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11.2 2.3l2.5 2.5L5.5 13H3v-2.5z"/><path d="M9.6 3.9l2.5 2.5"/></svg><span class="tl">編輯</span></button>
  </div>
  <label class="search" title="搜尋（按 / ）"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg><input id="q" type="search" placeholder=" " aria-label="搜尋" autocomplete="off"></label>
</div></header>
<main id="list"></main>
<script>
let items=[],groups=new Map(),mode='map';
const UNC='未分類';
// 有作品的群組（空群組只在編輯頁出現）
const live=()=>[...groups].filter(([,w])=>w.length);
const list=document.getElementById('list'),q=document.getElementById('q');
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
// 觸控沒有滑鼠停留：html.touch 打開替代的操作方式。以最近一次按下的是手指還是滑鼠為準
let touch=false;
const setTouch=v=>{touch=v;document.documentElement.classList.toggle('touch',v)};
setTouch(matchMedia('(hover:none)').matches);
addEventListener('pointerdown',e=>setTouch(e.pointerType==='touch'),true);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const day=d=>(d||'').replace(/-/g,'.');
const host=u=>{try{return new URL(u).pathname.replace(/\/$/,'').split('/').pop()||new URL(u).host}catch{return''}};
const full=(d,k)=>`decks/${encodeURIComponent(d.id)}/${d.slides[k]}`;
// 縮圖 t-XX.jpg（add_deck.py 產生）；舊簡報沒有縮圖時退回原圖
const thumb=(d,k)=>`decks/${encodeURIComponent(d.id)}/${d.slides[k].replace(/^s-/,'t-')}`;
const pic=(it,k=it.d?.cover??0,cls='')=>it.kind==='deck'
  ?`<img class="${cls}" src="${thumb(it.d,k)}" data-full="${full(it.d,k)}" onerror="this.onerror=null;this.src=this.dataset.full" loading="lazy" draggable="false" alt="">`
  :`<img class="${cls} ${it.s.fit==='contain'?'contain':''}" src="sites/${esc(it.s.shot)}" loading="lazy" draggable="false" alt="">`;
const tg=it=>it.kind==='site'?' target="_blank" rel="noopener"':'';
const fmt=d=>/\.pdf$/i.test(d.pptx)?'PDF':'PPT';   // 下載檔可能是 PPT 或 PDF
const dl=d=>d.pptx?`href="decks/${encodeURIComponent(d.id)}/${d.pptx}" download="${esc(d.title+d.pptx.slice(d.pptx.lastIndexOf('.')))}"`:'';
const spread=(len,n)=>Array.from({length:n},(_,k)=>Math.round(k*(len-1)/Math.max(n-1,1)));
// 橫掃預覽：最多取 8 頁，平均抽樣
const picks=d=>spread(d.slides.length,Math.min(d.slides.length,8));
const ghref=name=>'#g='+encodeURIComponent(name);

/* 圓環：一件作品一張封面。這個群組的排在一起（亮），其他群組各自排在一起（淡化），中間用空白卡隔開 */
function ringCards(works,n){
  const own=works.slice(0,n).map((it,w)=>({w,it}));
  const rest=[...groups.values()].filter(g=>g!==works&&g.length).map(g=>g.map(it=>({it,other:1})));
  const sections=[own];
  for(const g of rest)if(sections.flat().length+g.length<=n)sections.push(g);   // 放不下的群組整組略過，不拆開
  const blanks=n-sections.flat().length;
  return sections.flatMap((sec,i)=>[...sec,...Array.from({length:Math.floor(blanks/sections.length)+(i<blanks%sections.length?1:0)},()=>({blank:1}))]);
}
function ring(works,n,link){
  // 3D 變形裡的 lazy 圖片有時不會觸發載入，縮圖很小，直接載
  const cs=ringCards(works,n);
  return `<div class="ring"${link?' id="ring"':''}>${cs.map((c,i)=>{
    const pos=`style="--a:${(i*360/cs.length).toFixed(2)}deg"`;
    if(c.blank)return `<span class="c blank" ${pos}></span>`;
    const img=pic(c.it).replace(' loading="lazy"','');   // pic 預設就是封面
    if(c.other)return `<span class="c other" ${pos}>${img}</span>`;
    const a=`class="c own" data-w="${c.w}" ${pos}`;
    return link?`<a ${a} href="${c.it.href}"${tg(c.it)} draggable="false" tabindex="-1" aria-hidden="true">${img}</a>`:`<span ${a}>${img}</span>`;
  }).join('')}</div>`;
}

function mapView(){
  const top=items.find(it=>it.kind==='deck');
  return `<section class="map">
    ${top?`<a class="latest" href="${top.href}"><span class="shot">${pic(top)}</span><span class="mono">最新加入 · ${day(top.d.date)}</span><b>${esc(top.title)}</b></a>`:''}
    <div class="hub" title="${items.length} 件作品"><span class="mono">${pad(items.length)}</span></div>
    ${live().map(([name,works])=>`
    <a class="node" href="${ghref(name)}">
      <span class="orbit"><i class="axis"></i>${ring(works,26)}</span>
      <span class="lab"><b>${esc(name)}</b><span class="mono">${pad(works.length)} 件</span></span>
    </a>`).join('')}
    <i class="end"></i>
  </section>`;
}
/* 群組頁：所有群組的作品照順序排成同一圈，群組之間隔 GAP 張空白卡，剩下的空白全放在最後一組和第一組之間。
   flat[k] 是第 k 件：it 作品、g 群組、w 組內第幾件、slot 在圓環上第幾格。
   換群組不重畫，只是圓環轉到那一段、換哪一段亮（setGroup） */
const GAP=2;
let flat=[],slots=40;
function focusView(name){
  flat=[];let slot=0;
  for(const [g,ws] of live()){ws.forEach((it,w)=>flat.push({it,g,w,slot:slot++}));slot+=GAP}
  slots=Math.max(40,slot);
  const pos=n=>`style="--a:${(n*360/slots).toFixed(2)}deg"`,cards=Array.from({length:slots},(_,n)=>`<span class="c blank" ${pos(n)}></span>`);
  // 3D 變形裡的 lazy 圖片有時不會觸發載入，縮圖很小，直接載
  flat.forEach((f,k)=>cards[f.slot]=`<a class="c" data-w="${k}" ${pos(f.slot)} href="${f.it.href}"${tg(f.it)} draggable="false" tabindex="-1" aria-hidden="true">${pic(f.it).replace(' loading="lazy"','')}</a>`);
  const heads=live().map(([g,ws])=>`<span class="gh" data-g="${esc(g)}" data-n="${pad(ws.length)} 件" data-p="${flat.find(f=>f.g===g).slot-1.4}"><span class="mono">${pad(ws.length)} 件</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path class="tr" d="M6 9.5l6 6 6-6"/><path class="pg" pathLength="1" d="M6 9.5l6 6 6-6"/></svg><b>${esc(g)}</b></span>`);
  return `<section class="focus" data-g="${esc(name)}">
    <aside class="side">
      ${live().length>1?`<nav class="glist">${live().map(([n])=>`<a href="${ghref(n)}" data-g="${esc(n)}"${n===UNC?' class="unc"':''}>${esc(n)}</a>`).join('')}</nav>`:''}
      <div class="info"><div class="pv" id="pv"></div><div class="tx"><h2 id="it">${esc(name)}</h2><span class="mono" id="im"></span></div><a class="btn go" id="go" hidden></a></div>
      <nav class="chips" id="chips">${heads.join('')}${flat.map((f,k)=>`<a class="chip" data-w="${k}" data-p="${f.slot}" href="${f.it.href}"${tg(f.it)}><span class="mono">${pad(f.w+1)}</span><b>${esc(f.it.title)}</b></a>`).join('')}</nav>
    </aside>
    <a class="btn ghost back" href="#">← 地圖</a>
    <div class="orbit" id="orbit"><div class="ring" id="ring">${cards.join('')}</div></div>
    <span class="mono swipe">↕ 上下滑動選擇</span>
  </section>`;
}
function setGroup(g){
  const sec=list.querySelector('.focus');if(!sec)return;sec.dataset.g=g;pulling=false;
  sec.querySelectorAll('#ring a.c,.chip').forEach(el=>{const own=flat[el.dataset.w].g===g;el.classList.toggle('own',own);if(el.matches('.c'))el.classList.toggle('other',!own)});
  sec.querySelectorAll('.glist a').forEach(a=>{
    const cur=a.dataset.g===g,box=a.parentNode;a.classList.toggle('cur',cur);
    // 手機版上方的群組頁籤是橫向捲的：目前這組捲到看得到的地方
    if(cur&&wheelOn()){const x=a.getBoundingClientRect(),b=box.getBoundingClientRect();box.scrollTo({left:box.scrollLeft+x.left-b.left-(b.width-x.width)/2,behavior:still?'auto':'smooth'})}
  });
  if(decodeURIComponent(location.hash.slice(3))!==g)history.replaceState(null,'',ghref(g));
}

/* 列表 */
function card(it,i){
  return it.kind==='site'?`
  <div class="card site" style="--i:${i}">
    <a class="main" href="${it.href}"${tg(it)}>
      <span class="shot">${pic(it)}<span class="tag mono">開啟 ↗</span></span>
      <div class="meta"><div class="title">${esc(it.title)}</div><span class="mono">${esc(it.meta)}</span></div>
      <div class="desc">${esc(it.s.desc)}</div>
    </a>
    ${it.s.download?`<a class="act dl" title="下載 PDF" href="${esc(it.s.download)}" download>↓</a>`:''}
  </div>`:`
  <div class="card deck" style="--i:${i}" data-deck="${esc(it.d.id)}">
    <a class="main" href="${it.href}">
      <span class="shot">${pic(it)}<span class="segs">${picks(it.d).map((_,k)=>`<i class="${k?'':'on'}"></i>`).join('')}</span><span class="tag mono">播放 →</span></span>
      <div class="meta"><div class="title">${esc(it.title)}</div></div>
      <div class="desc mono">${esc(it.meta)}</div>
    </a>
    ${it.d.pptx?`<a class="act" title="下載 ${fmt(it.d)}" ${dl(it.d)}>↓</a>`:''}
  </div>`;
}
function hero(it){return `
  <section class="hero">
    <a class="shot" href="${it.href}"><img src="${full(it.d,0)}" alt=""></a>
    <div>
      <span class="mono">最新 · ${esc(it.meta)}</span>
      <h2>${esc(it.title)}</h2>
      <div class="acts"><a class="btn" href="${it.href}">播放 →</a>${it.d.pptx?`<a class="btn ghost" ${dl(it.d)}>下載 ${fmt(it.d)}</a>`:''}</div>
    </div>
  </section>`}
function listView(k){
  const hit=items.filter(it=>(it.title+' '+(it.s?.desc||'')+' '+it.group).toLowerCase().includes(k));
  const top=!k&&hit.find(it=>it.kind==='deck');
  let i=0;
  const secs=[...groups.keys()].map(name=>{
    const cs=groups.get(name).filter(it=>hit.includes(it));
    return cs.length?`<div class="sec mono"><b>${esc(name)}</b><span>${pad(cs.length)}</span></div><div class="grid">${cs.map(it=>card(it,i++)).join('')}</div>`:'';
  }).join('');
  return `<div class="wrap listv">${top?hero(top):'<div style="height:44px"></div>'}${secs||(top?'':'<div class="empty"><b>找不到東西</b>換個關鍵字試試</div>')}
    <footer class="mono"><span>簡報庫</span><span>${pad(items.length)} 件 · ${pad(live().length)} 群組</span></footer></div>`;
}

let eg=null,upOpen=false,dragIt=null,covFor=null;   // covFor：正在選封面頁的那張卡
function editView(){

function render(keep){
  const k=q.value.trim().toLowerCase();
  const g=decodeURIComponent((location.hash.match(/^#g=(.*)$/)||[])[1]||'');
  hot=null;goal=null;stopPv();io.disconnect();
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.mode===(k?'list':mode)));
  if(!k&&mode==='edit')list.innerHTML=editView();
  else if(k||mode==='list')list.innerHTML=listView(k);
  else if(groups.get(g)?.length){
    const first=()=>flat.findIndex(f=>f.g===g);
    // 已經在群組頁、只是換一組：什麼都不重畫，圓環自己轉過去
    if(soft&&list.querySelector('.focus')){setGroup(g);touch?pick(first()):setHot(null)}
    else{
      list.innerHTML=focusView(g);STEP=360/slots;vel=0;setGroup(g);
      if(touch){rebase(first());pick(first())}else setHot(null);
      wheel();
    }
  }
  else list.innerHTML=mapView();
  soft=false;
  if(keep!==true)scrollTo(0,0);
  list.querySelectorAll('.node,.card.deck').forEach(el=>io.observe(el));
}

/* 群組圓環：自轉、拖曳、滑過點亮同一件作品的整段弧 */
let rot=0,hot=null,drag=null,moved=false,goal=null,vel=0,base=0,soft=false;   // goal：圓環要轉過去的角度；vel：角速度（度／秒）；base：第 0 格在正面位置時的角度
function setHot(k){
  const sec=list.querySelector('.focus');if(!sec)return;
  const f=k!=null&&flat[k];hot=k;
  if(f&&f.g!==sec.dataset.g){setGroup(f.g);navigator.vibrate?.(8)}   // 選到別組的作品：整頁跟著換到那一組
  const works=groups.get(sec.dataset.g),it=f&&f.it,pv=sec.querySelector('#pv');
  sec.querySelector('.ring').classList.toggle('has-hot',k!=null);
  sec.querySelectorAll('.c,.chip').forEach(el=>el.classList.toggle('hot',k!=null&&+el.dataset.w===k));
  if(it)pv.innerHTML=pic(it);
  pv.classList.toggle('on',!!it);
  sec.querySelector('#it').textContent=it?it.title:sec.dataset.g;
  sec.querySelector('#im').textContent=it?it.meta:`${pad(works.length)} 件 · ${touch?'上下滑動選擇':'拖曳旋轉'}`;
  const go=sec.querySelector('#go');go.hidden=!it;
  if(it){go.href=it.href;go.target=it.kind==='site'?'_blank':'';go.rel=it.kind==='site'?'noopener':'';go.textContent=it.kind==='deck'?'播放 →':'開啟 ↗'}
}
/* 觸控版的「滑過」：圓環是一個滾輪。上下滑（或左右拖）轉動它，轉到正面位置的那件就是選中的，右下出現標題和開啟鈕；
   點卡片或標題也是選取，再點一次才開啟。寬螢幕的觸控：所有群組接在同一條上，滑過一組的最後一件就進到下一組 */
const FACE=-50;let STEP=9;   // STEP：相鄰兩格差幾度（render 時照圓環的格數算）
const norm=d=>(d%360+540)%360-180;
const aOf=c=>parseFloat(c.style.getPropertyValue('--a'));
const off=c=>norm(aOf(c)+rot-FACE);   // 這張卡離正面位置還差幾度
const near=(r=rot,own='')=>[...list.querySelectorAll('#ring a.c'+own)].sort((a,b)=>Math.abs(norm(aOf(a)+r-FACE))-Math.abs(norm(aOf(b)+r-FACE)))[0];
// 以第 k 件現在的位置為準重新對齊 base（圓環自轉或剛畫出來之後）
const rebase=k=>base=rot-off(list.querySelector(`#ring .c[data-w="${k}"]`))+flat[k].slot*STEP;
function pick(k){
  setHot(k);goal=k==null?null:base-flat[k].slot*STEP;   // 一律沿著清單的方向轉過去，不抄近路穿過尾端的空白
}
/* 右下的標題滾輪：位置直接由圓環角度換算，所以拖曳、慣性、回彈都跟圓環完全同步 */
const narrow=matchMedia('(max-width:860px)'),wheelOn=()=>touch&&narrow.matches;
const wheelPos=()=>(base-rot)/STEP;   // 目前轉到第幾格（有小數）
/* 手機的滾輪一次只看一組，換組像翻到下一章：滑到這一組的頭尾再多拉，上／下一組的名稱跟著放大，拉滿（PULL 格）放開就進去，
   名稱從放手的位置縮回它在滾輪上的位置。enter：剛換組的動畫 1→0；pin：放手時名稱在滾輪上的 y；pulling：這次拖曳還沒換過組 */
const PULL=1,REST={1:.78,'-1':.6};   // 上／下一組的名稱平常縮多小：上面那個貼著這一組的名稱，要更小才分得出主從
let enter=0,pin=null,pulling=false,gone=null,goneY=0,goneSh=0;   // gone：剛離開的那一組，它的作品跟著淡出、名稱滑到上／下一組的位置
const curG=()=>list.querySelector('.focus').dataset.g;
const span=()=>{const o=flat.filter(f=>f.g===curG());return[o[0].slot,o[o.length-1].slot]};   // 這一組的第一格、最後一格
const pullAt=()=>{const [a,b]=span(),p=wheelPos();return(p>b?p-b:p<a?p-a:0)/PULL};   // 拉過頭尾多少：正的往下一組，±1 就是拉滿
const nextG=d=>{const n=live().map(x=>x[0]);return n.length>1?n[(n.indexOf(curG())+d+n.length)%n.length]:null};   // 頭尾相接
const teaseP=(d,t,a,b)=>d>0?b+1.9-.6*t:a-2.9+1.4*t;   // 上／下一組的名稱放在滾輪的第幾格：下一組在最後一件下面；上一組在這一組名稱的上面，拉的時候往下讓到它的位置
function enterGroup(g,d){
  const k=flat.findIndex(f=>f.g===g),[a,b]=span();
  pin=(3+teaseP(d,1,a,b)-wheelPos())*36;
  gone=curG();goneSh=d>0?-24:72;goneY=(3+a-1.4-wheelPos())*36+goneSh;
  if(d>0&&flat[k].slot<b)base-=360;else if(d<0&&flat[k].slot>a)base+=360;   // 最後一組接回第一組：圓環繼續往同一個方向轉
  enter=still?0:1;vel=0;pick(k);
}
function wheel(){
  const box=document.getElementById('chips');if(!box)return;
  const on=wheelOn();box.classList.toggle('wheel',on);
  if(!on){if(box.dataset.on){delete box.dataset.on;[...box.children].forEach(c=>{c.style.cssText='';if(c.dataset.n)c.className='gh'})}return}
  const g=curG(),pos=wheelPos(),pl=pulling?pullAt():0,e=enter*enter*(3-2*enter);
  const key=[pos.toFixed(3),g,pl.toFixed(3),enter.toFixed(3)].join();if(box.dataset.on===key)return;box.dataset.on=key;
  const [a,b]=span(),nx=nextG(1),pv=nextG(-1),tp=Math.min(1,Math.abs(pl));
  const sh=!nx?0:pl>0?-24*tp:72*tp;   // 往外拉的時候這一組整個讓開：往下一組就往上退，往上一組就往下退
  const out=enter>0?gone:null,x=1-enter,boing=enter?Math.exp(-6*x)*Math.cos(8*x):0;   // 放開之後名稱縮回去：縮過頭一點再彈回來
  for(const c of box.children){
    const head=!!c.dataset.n,cg=head?c.dataset.g:flat[c.dataset.w].g,own=cg===g;
    // 只有兩組的時候上一組和下一組是同一個：靠近哪一頭就放哪一頭
    const dir=!head||own?0:c.dataset.g===nx&&(c.dataset.g!==pv||pos>=(a+b)/2)?1:c.dataset.g===pv?-1:0;
    let y=(3+ +c.dataset.p-pos)*36,sc=1,op=0;
    if(dir){
      const t=pl*dir>0?tp:0;
      const show=Math.max(0,Math.min(1,1-(dir>0?b-pos:pos-a)/.8));   // 轉到最後（第一）件才浮出來：差一件以上看不到，越靠近越清楚、從外側滑進來
      y=(3+teaseP(dir,t,a,b)-pos)*36+dir*(1-show)*24;const r=REST[dir];sc=r+(1.5-r)*t**1.4;op=(.75+.25*t)*(1-e)*show;
      if(cg===out){y+=(goneY-y)*e;op=(.75+.25*e)*Math.max(show,e)}   // 拉的時候已經縮到跟上／下一組一樣小，放開後只要滑過去
      c.style.setProperty('--t',t.toFixed(3));
    }else if(head&&own){
      const d=Math.abs(c.dataset.p-pos);op=Math.max(Math.min(1,e*3),1-Math.max(0,d-.8)*.4);sc=1+.5*boing;
      y+=sh;if(pin!=null)y+=(pin-y)*e;
      if(nx){sc-=(1-REST[pl>0?-1:1])*tp;c.style.setProperty('--o',tp.toFixed(3))}   // 往外拉：舊的名稱縮小變淡，新的放大
    }else if(own){
      const d=Math.abs(c.dataset.p-pos);sc=1+.12*Math.max(0,1-d);op=Math.max(0,1-d*.3)*Math.max(0,1-2*e);y+=sh;   // 剛換組：作品等名稱縮回去再浮出來，不從名稱底下穿過
    }else if(cg===out){
      const d=Math.abs(c.dataset.p-pos);op=Math.max(0,1-d*.3)*e;y+=goneSh*e;
    }
    if(head){c.classList.toggle('pull',!!dir);c.classList.toggle('prev',dir<0);c.classList.toggle('armed',!!dir&&pl*dir>=1)}
    const hide=op<=0||y<-80||y>300;c.style.visibility=hide?'hidden':'';if(hide)continue;
    c.style.transform=`translateY(${y.toFixed(2)}px) scale(${sc.toFixed(3)})`;
    c.style.opacity=op.toFixed(3);
  }
}
let lastT=0;
(function tick(t){
  const r=document.getElementById('ring'),dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;
  if(r){
    if(goal!=null&&!drag){
      // 彈簧：帶著放手時的速度滑過去，停得柔一點
      if(still){rot=goal;vel=0}
      else for(let k=Math.ceil(dt/.008),h=dt/k;k>0;k--){vel+=(120*(goal-rot)-20*vel)*h;rot+=vel*h}
      if(Math.abs(goal-rot)<.02&&Math.abs(vel)<.5){rot=goal;goal=null;vel=0}
    }
    else if(hot==null&&!drag&&!still)rot+=.07;
    r.style.setProperty('--rot',rot.toFixed(2)+'deg');
    if(enter>0)enter=Math.max(0,enter-dt/.6);
    wheel();
  }
  requestAnimationFrame(tick);
})();
list.addEventListener('pointerdown',e=>{
  if(!e.target.closest(touch?'#orbit,#chips':'#orbit'))return;   // 觸控：在右下的標題滾輪上滑也算
  drag={x:e.clientX,y:e.clientY,rot,t:e.timeStamp,v:0};moved=false;
  // 觸控：只能在第一件到最後一件之間轉，超過會有阻力
  const c=touch&&near();
  if(c){rebase(+c.dataset.w);drag.max=base;drag.min=base-flat[flat.length-1].slot*STEP}
  // 手機的滾輪：只在這一組裡面轉，拉過頭尾是換組
  if(c&&wheelOn()){
    if(enter>.05){drag=null;return}   // 換組的動畫還沒跑完
    const [a,b]=span();drag.max=base-a*STEP;drag.min=base-b*STEP;drag.chap=pulling=true;
  }
});
addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!moved&&Math.max(Math.abs(dx),Math.abs(dy))>6){
    moved=true;goal=null;vel=0;document.getElementById('orbit')?.classList.add('drag');
    if(touch)document.documentElement.classList.add('swiped');else setHot(null);
  }
  if(!moved)return;
  let r=drag.rot+dx*.3+(touch?dy*.3:0);
  if(drag.max!=null){const k=drag.chap?.32:.25;r=r>drag.max?drag.max+(r-drag.max)*k:r<drag.min?drag.min+(r-drag.min)*k:r}
  if(drag.chap)r=Math.max(drag.min-1.4*STEP,Math.min(drag.max+1.4*STEP,r));   // 拉滿之後就不再跟著走，名稱停在中間
  const dt=e.timeStamp-drag.t;if(dt>0){drag.v=.6*drag.v+.4*(r-rot)/dt;drag.t=e.timeStamp}
  rot=r;
  // 邊轉邊換選中的那件
  const c=touch&&near(rot,drag.chap?'.own':'');
  if(c&&+c.dataset.w!==hot){setHot(+c.dataset.w);navigator.vibrate?.(4)}
  if(drag.chap){const p=pullAt(),on=Math.abs(p)>=1&&!!nextG(Math.sign(p));if(on!==!!drag.armed){drag.armed=on;navigator.vibrate?.(on?12:4)}}
});
addEventListener('pointerup',e=>{
  // 觸控：放手後順著甩的力道再轉一點，停在最近的一件上
  if(drag&&moved&&touch&&drag.max!=null){
    const p=drag.chap?pullAt():0,to=Math.abs(p)>=1&&nextG(Math.sign(p));
    const v=e.timeStamp-drag.t<90?drag.v:0,c=near(Math.max(drag.min,Math.min(drag.max,rot+v*180)),drag.chap?'.own':'');
    if(to)enterGroup(to,Math.sign(p));
    else if(c){pick(+c.dataset.w);vel=v*1000}
  }
  drag=null;document.getElementById('orbit')?.classList.remove('drag');
});
addEventListener('pointercancel',()=>{drag=null});
list.addEventListener('click',e=>{
  if(Date.now()-scrubEnd<400&&e.target.closest('.card')){e.preventDefault();return}   // 剛在縮圖上橫滑完，不算點擊
  if(!e.target.closest('.focus'))return;
  if(moved&&e.target.closest('#orbit,#chips')){e.preventDefault();moved=false;return}
  if(!touch){
    // 滑鼠點別組（淡化）的卡片：換到那一組
    const o=e.target.closest('#ring a.other');
    if(o){e.preventDefault();location.hash=ghref(flat[o.dataset.w].g)}
    return;
  }
  // 觸控：點上方的群組名稱，滾輪直接滑到那一組的第一件
  const tab=e.target.closest('.glist a');
  if(tab){e.preventDefault();if(tab.dataset.g!==curG()){pin=gone=null;enter=still?0:1}pick(flat.findIndex(f=>f.g===tab.dataset.g));return}
  const el=e.target.closest('#ring a.c,.chip');
  if(el&&hot!==+el.dataset.w){e.preventDefault();pick(+el.dataset.w)}
},true);
list.addEventListener('mouseover',e=>{
  if(touch)return;   // 手指點一下也會補發 mouseover，會搶在 click 前面把它選起來
  const el=e.target.closest('#ring .c.own,.chip.own');
  if(el){if(!drag&&hot!==+el.dataset.w)setHot(+el.dataset.w)}
  else if(hot!=null&&list.querySelector('.focus'))setHot(null);
});
list.addEventListener('focusin',e=>{const el=e.target.closest('.chip.own');if(el&&!touch)setHot(+el.dataset.w)});
list.addEventListener('mouseleave',()=>{if(hot!=null&&!touch)setHot(null)});

/* 列表卡片：橫掃預覽 */
const deckOf=card=>items.find(it=>it.kind==='deck'&&it.d.id===card.dataset.deck).d;
function setPage(shot,d,k){
  const p=picks(d);shot.dataset.k=k;
  shot.querySelector('img').src=thumb(d,p[k]);
  shot.querySelectorAll('.segs i').forEach((el,j)=>el.classList.toggle('on',j<=k));
}
function scrub(shot,x){
  const d=deckOf(shot.closest('.card')),r=shot.getBoundingClientRect();
  const k=Math.max(0,Math.min(picks(d).length-1,Math.floor((x-r.left)/r.width*picks(d).length)));
  if(shot.dataset.k!=k)setPage(shot,d,k);
}
function resetShot(c){
  const d=deckOf(c),shot=c.querySelector('.shot');
  delete shot.dataset.k;shot.querySelector('img').src=thumb(d,d.cover??0);
  shot.querySelectorAll('.segs i').forEach((el,j)=>el.classList.toggle('on',!j));
}
list.addEventListener('mousemove',e=>{
  const shot=!touch&&e.target.closest('.card.deck .shot');if(shot)scrub(shot,e.clientX);
});
list.addEventListener('mouseout',e=>{
  const c=!touch&&e.target.closest('.card.deck');if(c&&!c.contains(e.relatedTarget))resetShot(c);
});
/* 觸控版的橫掃預覽：卡片捲到畫面中段自動翻一輪；手指在縮圖上左右滑可以自己翻 */
let pv=null,sc=null,scrubEnd=0;
function stopPv(){if(!pv)return;clearInterval(pv.t);if(pv.c.isConnected){pv.c.classList.remove('live');resetShot(pv.c)}pv=null}
function startPv(c){
  stopPv();const d=deckOf(c),shot=c.querySelector('.shot'),n=picks(d).length;let k=0;
  if(n<2)return;c.classList.add('live');
  pv={c,t:setInterval(()=>++k<n?setPage(shot,d,k):stopPv(),700)};
}
const io=new IntersectionObserver(es=>es.forEach(e=>{
  const el=e.target;
  if(el.matches('.node'))el.classList.toggle('near',e.isIntersecting);
  else if(e.isIntersecting){if(touch&&!still&&!sc)startPv(el)}
  else if(pv?.c===el)stopPv();
}),{rootMargin:'-45% 0px -45% 0px'});
list.addEventListener('pointerdown',e=>{
  const shot=e.pointerType==='touch'&&e.target.closest('.card.deck .shot');
  if(shot)sc={shot,x:e.clientX,on:false};
});
addEventListener('pointermove',e=>{
  if(!sc)return;
  if(!sc.on&&Math.abs(e.clientX-sc.x)>10){sc.on=true;stopPv();sc.shot.closest('.card').classList.add('live')}
  if(sc.on)scrub(sc.shot,e.clientX);
});
const scEnd=()=>{
  if(sc?.on){
    const c=sc.shot.closest('.card');scrubEnd=Date.now();
    setTimeout(()=>{if(c.isConnected&&pv?.c!==c&&!sc){c.classList.remove('live');resetShot(c)}},1600);
  }
  sc=null;
};
addEventListener('pointerup',scEnd);addEventListener('pointercancel',scEnd);

document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;mode=b.dataset.mode;q.value='';
  if(mode==='map'&&location.hash){location.hash='';return}
  render();
});
addEventListener('hashchange',()=>{if(location.hash)mode='map';soft=mode==='map'&&!q.value.trim();render()});
q.addEventListener('input',()=>render());
addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}
  else if(e.key==='Escape'){
    if(document.activeElement===q){q.value='';q.blur();render()}
    else if(location.hash)location.hash='';
  }
});
const get=f=>fetch(f,{cache:'no-cache'}).then(r=>r.json()).catch(()=>[]);
function load(keep){
  return Promise.all([get('decks.json'),get('sites.json'),get('groups.json')]).then(([d,s,gs])=>{
    // 同一天的，後加入的排前面
    d.reverse().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    items=[
      ...d.map(d=>({kind:'deck',d,title:d.title,group:d.group||UNC,href:`play.html?deck=${encodeURIComponent(d.id)}`,meta:`${pad(d.slides.length)} 頁 · ${day(d.date)}`})),
      ...s.map(s=>({kind:'site',s,title:s.title,group:s.group||UNC,href:s.url,meta:host(s.url)})),
    ];
    // groups.json 決定順序，也記得空的群組；未分類排最後
    groups=new Map(gs.map(g=>[g,[]]));
    items.filter(it=>it.group!==UNC).forEach(it=>groups.set(it.group,[...(groups.get(it.group)||[]),it]));
    const unc=items.filter(it=>it.group===UNC);if(unc.length)groups.set(UNC,unc);
    // 群組內照編輯頁排的順序（order）；沒排過的維持原本順序、排在後面
    const rank=it=>(it.d||it.s).order??1e9;
    for(const g of groups.values())g.sort((a,b)=>rank(a)-rank(b));
    document.getElementById('total').textContent=pad(items.length)+' 件';render(keep);
  });
}
load();

/* 編輯：只有用 admin.py 在本機開啟時才有 */
const api=(path,body,raw)=>fetch('/api/'+path,{method:'POST',headers:{'X-Admin':'1',...(raw?{}:{'Content-Type':'application/json'})},body:raw?body:JSON.stringify(body||{})})
  .then(async r=>{const j=await r.json().catch(()=>({error:'伺服器沒有回應'}));if(!r.ok)throw new Error(j.error||'失敗');return j});
fetch('/api/ping').then(r=>r.ok&&r.json()).then(j=>{if(j&&j.ok)document.getElementById('editbtn').hidden=false}).catch(()=>{});
function ask(msg,{input=false,ok='確定',danger=false}={}){
  return new Promise(done=>{
    const d=document.createElement('dialog');d.className='dlg';
    d.innerHTML=`<form method="dialog"><p></p>${input?'<input maxlength="120" required>':''}<div class="go"><button type="button" class="btn ghost">取消</button><button value="ok" class="btn ${danger?'danger':''}">${ok}</button></div></form>`;
    d.querySelector('p').textContent=msg;
    d.querySelector('[type=button]').onclick=()=>d.close('');
    d.onclose=()=>{const yes=d.returnValue==='ok',v=input?(yes?d.querySelector('input').value.trim():''):yes;d.remove();done(v)};
    document.body.append(d);d.showModal();
  });
}
const act=(path,body)=>api(path,body).then(()=>load(true)).catch(e=>{alert(e.message);load(true)});
const idOf=el=>{const c=el.closest('.ecard');return{kind:c.dataset.kind,id:c.dataset.id}};
list.addEventListener('change',e=>{
  const el=e.target;
  if(el.classList.contains('gname')){const to=el.value.trim();if(to)eg=to;act('group-rename',{from:el.dataset.g,to})}
  else if(el.classList.contains('f-cover')){const n=parseInt(el.value,10);act('update',{...idOf(el),cover:n>0?n-1:null})}
  else if(el.classList.contains('f-title'))act('update',{...idOf(el),title:el.value});
});
list.addEventListener('click',e=>{
  const on=sel=>e.target.closest(sel);
  if(on('#gadd')){
    ask('新群組的名稱',{input:true,ok:'新增'}).then(name=>{if(name){eg=name;act('group-add',{name})}});
  }else if(on('.gt')){eg=on('.gt').dataset.g;render(true)}
  else if(on('#upbtn')){upOpen=!upOpen;render(true)}
  else if(on('#gdel')){
    const name=document.querySelector('.gname').dataset.g;
    ask(`刪除群組「${name}」？\n裡面的作品不會被刪，會回到未分類。`,{ok:'刪除群組',danger:true}).then(y=>{if(y){eg=null;act('group-delete',{name})}});
  }else if(on('.ecard .shot')){
    const c=on('.ecard'),open=!c.classList.contains('open');
    if(!c.querySelector('.cov'))return;                       // 網站沒有封面頁可選
    list.querySelectorAll('.ecard.open').forEach(el=>el.classList.remove('open'));
    c.classList.toggle('open',open);covFor=open?c.dataset.id:null;
    if(open)c.querySelector('.f-cover').select();
  }else if(on('.ecard .x')){
    const c=on('.ecard');
    const it=idOf(c);
    ask(`刪除「${c.querySelector('.f-title').value}」？\n檔案會移到 .trash 資料夾，不會真的消失。`,{ok:'刪除',danger:true}).then(y=>{if(y)act('delete',it)});
  }else if(on('#pub')){
    const b=on('#pub'),log=document.getElementById('publog');
    ask('把目前的改動推上 GitHub，線上版會跟著更新。',{ok:'發佈'}).then(y=>{
      if(!y)return;b.disabled=true;log.className='';log.textContent='發佈中…';
      api('publish').then(j=>log.textContent='已發佈，線上版約一分鐘後更新。\n'+j.log).catch(err=>{log.className='err';log.textContent=err.message}).finally(()=>b.disabled=false);
    });
  }
});
/* 拖群組調整順序 */
let dragG=null;
const insSide=(t,e)=>{const r=t.getBoundingClientRect();return e.clientX<r.left+r.width/2?'ins-l':'ins-r'};
list.addEventListener('dragstart',e=>{
  const t=e.target.closest('.gt[draggable]');if(!t||e.target.closest('.ecard'))return;
  dragG=t.dataset.g;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragG);
  setTimeout(()=>t.classList.add('lift'));
});
list.addEventListener('dragover',e=>{
  if(!dragG)return;const t=e.target.closest('.gt[draggable]');
  list.querySelectorAll('.ins-l,.ins-r').forEach(el=>el.classList.remove('ins-l','ins-r'));
  if(!t||t.dataset.g===dragG)return;
  e.preventDefault();e.dataTransfer.dropEffect='move';t.classList.add(insSide(t,e));
});
list.addEventListener('drop',e=>{
  if(!dragG)return;const t=e.target.closest('.gt[draggable]'),g=dragG;dragG=null;
  if(!t||t.dataset.g===g)return;e.preventDefault();
  const names=[...list.querySelectorAll('.gt[draggable]')].map(el=>el.dataset.g).filter(n=>n!==g);
  names.splice(names.indexOf(t.dataset.g)+(insSide(t,e)==='ins-r'?1:0),0,g);
  act('group-order',{names});
});
list.addEventListener('dragend',()=>{dragG=null;list.querySelectorAll('.lift,.ins-l,.ins-r').forEach(el=>el.classList.remove('lift','ins-l','ins-r'))});
list.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.gt'))e.target.click()});

/* 拖曳圖示換群組 */
list.addEventListener('dragstart',e=>{
  const c=e.target.closest('.ecard');if(!c)return;
  dragIt=idOf(c);e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragIt.id);
  // 等瀏覽器拍完拖曳縮圖再變淡
  setTimeout(()=>{c.classList.add('ghost');list.querySelector('.edit')?.classList.add('dragging')});
});
list.addEventListener('dragend',()=>{dragIt=null;list.querySelectorAll('.ghost,.dragging,.over,.ins-t,.ins-b').forEach(el=>el.classList.remove('ghost','dragging','over','ins-t','ins-b'))});
/* 拖到同群組的另一件上：調整順序 */
const rowSide=(t,e)=>{const r=t.getBoundingClientRect();return e.clientY<r.top+r.height/2?'ins-t':'ins-b'};
list.addEventListener('dragover',e=>{
  if(!dragIt)return;const t=e.target.closest('.ecard');
  list.querySelectorAll('.ins-t,.ins-b').forEach(el=>el.classList.remove('ins-t','ins-b'));
  if(!t||t.dataset.id===dragIt.id)return;
  e.preventDefault();e.dataTransfer.dropEffect='move';t.classList.add(rowSide(t,e));
});
list.addEventListener('drop',e=>{
  const t=e.target.closest('.ecard');if(!dragIt||!t||t.dataset.id===dragIt.id)return;
  e.preventDefault();const it=dragIt;dragIt=null;
  const order=[...list.querySelectorAll('.ecard')].map(idOf).filter(x=>x.id!==it.id);
  order.splice(order.findIndex(x=>x.id===t.dataset.id)+(rowSide(t,e)==='ins-b'?1:0),0,it);
  act('item-order',{items:order});
});
list.addEventListener('dragover',e=>{
  const t=e.target.closest('.gt');if(!dragIt||!t||t.classList.contains('on'))return;
  e.preventDefault();e.dataTransfer.dropEffect='move';t.classList.add('over');
});
list.addEventListener('dragleave',e=>{const t=e.target.closest('.gt');if(t&&!t.contains(e.relatedTarget))t.classList.remove('over')});
list.addEventListener('drop',e=>{
  const t=e.target.closest('.gt');if(!dragIt||!t||t.classList.contains('on'))return;
  e.preventDefault();const it=dragIt;dragIt=null;
  const move=g=>g?act('update',{...it,group:g===UNC?'':g}):load(true);
  t.id==='gadd'?ask('新群組的名稱',{input:true,ok:'新增並搬過去'}).then(move):move(t.dataset.g);
});
list.addEventListener('submit',e=>{
  if(e.target.id!=='up')return;e.preventDefault();
  const f=e.target,pdf=f.pdf.files[0],ppt=f.pptx.files[0],st=document.getElementById('ups'),btn=f.querySelector('button');
  const qs=o=>new URLSearchParams(o).toString(),g=eg&&groups.has(eg)&&eg!==UNC?eg:'';
  btn.disabled=true;st.className='mono';st.textContent='上傳並轉檔中，頁數多的話要等半分鐘…';
  api('upload?'+qs({title:f.title.value,group:g,name:pdf.name}),pdf,true)
    .then(j=>ppt?api('pptx?'+qs({id:j.id,name:ppt.name}),ppt,true):j)
    .then(()=>{upOpen=false;return load(true)})
    .catch(err=>{st.className='mono err';st.textContent=err.message;btn.disabled=false});
});
</script>
