<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>播放</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:14px -apple-system,"PingFang TC",sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
#stage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;padding:10px 14px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;transition:opacity .3s}
#bar.hide{opacity:0;pointer-events:none}
#bar button,#bar a{background:rgba(255,255,255,.15);border:0;color:#fff;padding:8px 12px;border-radius:8px;font-size:14px;cursor:pointer;text-decoration:none}
#bar .sp{flex:1;text-align:center}
#bar.hide~*{cursor:none}
/* 簡易密碼鎖：deck 在 decks.json 設了 lock 才會出現。封面糊成底，中間一塊液態玻璃 */
#gate{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#ececec;color:#111113}
#gate .bg{position:absolute;inset:-80px;background:#d9d9dc center/cover no-repeat;filter:blur(44px) saturate(1.5);transform:scale(1.15)}
#gate::after{content:"";position:absolute;inset:-40px;filter:blur(36px);background:radial-gradient(38% 34% at 28% 30%,rgba(90,140,255,.6),transparent 70%),radial-gradient(34% 30% at 74% 68%,rgba(255,150,100,.55),transparent 70%),radial-gradient(30% 28% at 70% 22%,rgba(180,120,255,.45),transparent 70%)}
#gate form{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:16px;padding:34px 40px 24px;border-radius:30px;
  background:linear-gradient(145deg,rgba(255,255,255,.62),rgba(255,255,255,.26));
  backdrop-filter:blur(28px) saturate(1.7);-webkit-backdrop-filter:blur(28px) saturate(1.7);
  box-shadow:0 0 0 1px rgba(255,255,255,.7),inset 0 1px 1px rgba(255,255,255,.95),inset 0 -1px 2px rgba(0,0,0,.07),0 28px 70px -24px rgba(0,0,0,.4)}
#gate svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.65}
#gate input{width:150px;padding:12px 14px;border:0;border-radius:14px;background:rgba(255,255,255,.55);color:#111113;font:inherit;font-size:22px;letter-spacing:.4em;text-indent:.4em;text-align:center;outline:0;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.85),inset 0 2px 6px rgba(0,0,0,.08);transition:box-shadow .2s}
#gate input:focus{box-shadow:inset 0 0 0 1px #fff,inset 0 2px 6px rgba(0,0,0,.08),0 0 0 3px rgba(255,255,255,.55)}
#gate input.bad{animation:shake .3s;box-shadow:inset 0 0 0 1.5px #e5484d,inset 0 2px 6px rgba(0,0,0,.08)}
#gate a{color:rgba(17,17,19,.55);font-size:13px;text-decoration:none;padding:6px 12px;border-radius:999px;transition:background .2s,color .2s}
#gate a:hover{background:rgba(255,255,255,.55);color:#111113}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body>
<div id="stage"><img id="img" alt=""></div>
<div id="bar">
  <a href="index.html">← 返回</a>
  <button id="prev">‹</button>
  <span class="sp" id="count"></span>
  <button id="next">›</button>
  <button id="fs" title="全螢幕 (F)">⛶</button>
  <a id="dl" style="display:none" download title="下載 PPT">⬇</a>
</div>
<script>
const id=new URLSearchParams(location.search).get('deck');
const img=document.getElementById('img'),count=document.getElementById('count'),bar=document.getElementById('bar');
let deck,i=0,locked=false;   // locked：密碼鎖畫面開著時，翻頁與快捷鍵一律不動作
function show(n){
  if(locked)return;
  i=Math.max(0,Math.min(deck.slides.length-1,n));
  img.src=`decks/${deck.id}/${deck.slides[i]}`;
  count.textContent=`${i+1} / ${deck.slides.length}`;
  history.replaceState(null,'',`?deck=${encodeURIComponent(id)}#${i+1}`);
  [i+1,i+2].forEach(k=>{if(deck.slides[k])new Image().src=`decks/${deck.id}/${deck.slides[k]}`});
}
function fs(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
document.getElementById('prev').onclick=e=>{e.stopPropagation();show(i-1)};
document.getElementById('next').onclick=e=>{e.stopPropagation();show(i+1)};
document.getElementById('fs').onclick=e=>{e.stopPropagation();fs()};
document.getElementById('stage').onclick=e=>show(e.clientX<innerWidth/3?i-1:i+1);
addEventListener('keydown',e=>{
  if(locked)return;   // 讓輸入框自己處理 Enter、Backspace
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();show(i+1)}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();show(i-1)}
  else if(e.key==='Home')show(0);
  else if(e.key==='End')show(deck.slides.length-1);
  else if(e.key==='f'||e.key==='F')fs();
});
let tx=null;
addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40)show(dx<0?i+1:i-1);tx=null});
let t;function wake(){bar.classList.remove('hide');document.body.style.cursor='';clearTimeout(t);t=setTimeout(()=>{bar.classList.add('hide');document.body.style.cursor='none'},2500)}
addEventListener('mousemove',wake);wake();
fetch('decks.json',{cache:'no-cache'}).then(r=>r.json()).then(all=>{
  deck=all.find(d=>d.id===id);
  if(!deck){count.textContent='找不到簡報';return}
  document.title=deck.title;
  const start=()=>{
    if(deck.pptx){
      const dl=document.getElementById('dl');
      dl.href=`decks/${deck.id}/${deck.pptx}`;
      dl.download=`${deck.title}${deck.pptx.slice(deck.pptx.lastIndexOf('.'))}`;
      dl.style.display='';
    }
    show((parseInt(location.hash.slice(1))||1)-1);
  };
  const key='unlock:'+deck.id;
  let ok=false;try{ok=!deck.lock||sessionStorage.getItem(key)==='1'}catch{ok=!deck.lock}
  if(ok)return start();
  // 鎖著的簡報：輸入對了才載入圖片，同一個分頁內不用再輸入
  locked=true;
  const g=document.createElement('div');g.id='gate';
  const cov=deck.slides[deck.cover??0]||deck.slides[0];
  g.innerHTML='<div class="bg"></div><form><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg><input type="password" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="密碼" autofocus><a href="index.html">← 返回</a></form>';
  document.body.append(g);
  g.querySelector('.bg').style.backgroundImage=`url("decks/${deck.id}/${cov.replace(/^s-/,'t-')}")`;   // 縮圖糊掉當底，不會露出內容
  const inp=g.querySelector('input');inp.focus();
  g.querySelector('form').onsubmit=e=>{
    e.preventDefault();
    if(inp.value===String(deck.lock)){
      try{sessionStorage.setItem(key,'1')}catch{}
      locked=false;g.remove();start();
    }else{inp.classList.remove('bad');void inp.offsetWidth;inp.classList.add('bad');inp.select()}
  };
});
</script>
</body>
</html>
